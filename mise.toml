# Single source of truth for Node, Bun, Python, uv, and pnpm versions.
#
# Local dev:  `mise install` (after `brew install mise` / `winget install jdx.mise` / `curl https://mise.run | sh`)
# CI:         exact versions are read from `mise.lock` by the composite actions
#             under `.github/actions/`; Bun is installed directly by mise
#
# pnpm is pinned through mise's npm backend so mise owns the full local and CI
# toolchain. We do not rely on Corepack because Node.js no longer distributes it
# starting with v25.

min_version = "2026.8.15"

[tool_alias]
bun = "http:bun"

[tools]
"npm:pnpm" = "11.8.0"
node = "24.22.1"
python = "3.12"
uv = "0.13.5"

# These immutable npm platform packages contain Bun's stable release binaries;
# mise extracts the matching one directly, with no npm lifecycle involved.
#
# `version` is the full value reported by `bun --revision`, while the tarballs
# use Bun's package version. When bumping Bun, change the URLs and `version`
# together, then run `mise install`. `pnpm run test:toolchain` verifies the
# declared revision against the installed binary.
[tools.bun]
version = "1.4.4+38afee6c8"
bin_path = "package/bin"

[tools.bun.platforms.macos-arm64]
url = "https://registry.npmjs.org/@oven/bun-darwin-aarch64/-/bun-darwin-aarch64-1.4.4.tgz"
checksum = "sha512:cd6fe1c7073cb090082c6c01e5e4c2e22e3ca2e1977f457896bc6610e93724813a2646155b54d9875136a487a6a6ab1ece05b5b1c9132080ee74538df1b27633"

[tools.bun.platforms.macos-x64]
url = "https://registry.npmjs.org/@oven/bun-darwin-x64/-/bun-darwin-x64-1.4.4.tgz"
checksum = "sha512:a0a19cc4bb2f878a078c0a36f273e6f1cff1374a3f3a61b28f520761cf78be9ae45ac5b684d83691e119b797f8d1c2391efbb88c395245347450da6fd54200c7"

[tools.bun.platforms.linux-arm64]
url = "https://registry.npmjs.org/@oven/bun-linux-aarch64/-/bun-linux-aarch64-1.4.4.tgz"
checksum = "sha512:65356da5ff7398748154f5f5b01c1ee5a8066ffacddf8c8f1a0fc76f2f1ed80c76b82500d944592a5647eea2e7b4aeea68524231787dbf4196358376cc8373d7"

[tools.bun.platforms.linux-x64]
url = "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-1.4.4.tgz"
checksum = "sha512:0876db9261d5336f13d4616afba18be00a38ba3c306308f50b1145c041732da9cf7cdb0877d0216c83f4438ade5ae5819068a6524a10ca0acaed1823b63defa2"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
lockfile = true
locked = true
