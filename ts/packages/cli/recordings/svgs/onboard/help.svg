<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2250"><rect width="1400" height="2250" rx="0" fill="#303446"/><g id="window-bar"><path d="M 0,0 L 1400,0 Q 1400,0 1400,0 L 1400,30 L 0,30 L 0,0 Q 0,0 0,0 Z" fill="#303446"/><circle cx="20" cy="15" r="6" fill="#ff5f58"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#18c132"/></g><svg x="20" y="50" width="1360" height="2180" viewBox="0 0 1360 2180"><rect width="1360" height="2180" fill="#303446"/><style>@keyframes typing_0 {  from { width: 0; }  to { width: 200px; }}.typing_0 {  overflow: hidden;  white-space: nowrap;  display: inline-block;  animation: typing_0 0.43s steps(20, end) forwards;  animation-delay: 0.03s;}@keyframes slide {  0% { transform: translateX(0px); }  1.6% { transform: translateX(-1360px); }  3.3% { transform: translateX(-2720px); }  4.9% { transform: translateX(-4080px); }  6.6% { transform: translateX(-5440px); }  8.2% { transform: translateX(-6800px); }  9.8% { transform: translateX(-8160px); }  11.5% { transform: translateX(-9520px); }  13.1% { transform: translateX(-10880px); }  14.8% { transform: translateX(-12240px); }  16.4% { transform: translateX(-13600px); }  23% { transform: translateX(-14960px); }  29.5% { transform: translateX(-16320px); }  54.1% { transform: translateX(-17680px); }  100% { transform: translateX(-17680px); }}.animation-container {  animation: slide 2.07s step-end 0s infinite;}.t { fill: #c6d0f5; font-family: JetBrains Mono, monospace; font-size: 16px; }.b { fill: #8caaee; }.m { fill: #f4b8e4; }.c { fill: #81c8be; }.w { fill: #b5bfe2; }.k { fill: #51576d; }.r { fill: #e78284; }.g { fill: #a6d189; }.y { fill: #e5c890; }.p { fill: #8caaee; }.ca { }</style><defs></defs><g class="animation-container"><g transform="translate(0,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">co</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(1360,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">comp</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(2720,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">compos</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(4080,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(5440,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio o</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(6800,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onb</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(8160,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboar</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(9520,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard </tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(10880,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard --</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(12240,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard --he</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(13600,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard --help</tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(14960,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard --help</tspan></text><text y="58.8" xml:space="preserve"><tspan x="0"></tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(16320,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard --help</tspan></text><text y="58.8" xml:space="preserve"><tspan class="t w">composio</tspan></text><text y="100.8" xml:space="preserve"><tspan class="t">composio 0.3.0</tspan></text><text y="142.8" xml:space="preserve"><tspan class="t">USAGE</tspan></text><text y="184.8" xml:space="preserve"><tspan class="t">$ onboard [--toolkit text] [--task text] [--json] [(-y, --yes)] [--status] --skip connect | execute... [--reset]</tspan></text><text y="226.8" xml:space="preserve"><tspan class="t">DESCRIPTION</tspan></text><text y="268.8" xml:space="preserve"><tspan class="t">Get from a fresh install to a working tool call.</tspan></text><text y="289.8" xml:space="preserve"><tspan class="t">Sequences login, connecting an account, and running your first tool, resuming wherever you left off.</tspan></text><text y="331.8" xml:space="preserve"><tspan class="t">Examples:</tspan></text><text y="352.8" xml:space="preserve"><tspan class="t">  composio onboard</tspan></text><text y="373.8" xml:space="preserve"><tspan class="t">  composio onboard --toolkit github</tspan></text><text y="394.8" xml:space="preserve"><tspan class="t">  composio onboard --status</tspan></text><text y="415.8" xml:space="preserve"><tspan class="t">  composio onboard --json                    Machine-readable state, no prompts</tspan></text><text y="457.8" xml:space="preserve"><tspan class="t">See also:</tspan></text><text y="478.8" xml:space="preserve"><tspan class="t">  composio setup                             Wire Composio into Claude Code or Codex</tspan></text><text y="499.8" xml:space="preserve"><tspan class="t">  composio search &#34;&lt;query&gt;&#34;                  Find a tool once you are connected</tspan></text><text y="541.8" xml:space="preserve"><tspan class="t">OPTIONS</tspan></text><text y="583.8" xml:space="preserve"><tspan class="t">--toolkit text</tspan></text><text y="625.8" xml:space="preserve"><tspan class="t">  A user-defined piece of text.</tspan></text><text y="667.8" xml:space="preserve"><tspan class="t">  Toolkit to connect and demo (e.g. &#34;github&#34;, &#34;gmail&#34;)</tspan></text><text y="709.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="751.8" xml:space="preserve"><tspan class="t">--task text</tspan></text><text y="793.8" xml:space="preserve"><tspan class="t">  A user-defined piece of text.</tspan></text><text y="835.8" xml:space="preserve"><tspan class="t">  Starter task to run, by id or free text (e.g. &#34;read my inbox&#34;)</tspan></text><text y="877.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="919.8" xml:space="preserve"><tspan class="t">--json</tspan></text><text y="961.8" xml:space="preserve"><tspan class="t">  A true or false value.</tspan></text><text y="1003.8" xml:space="preserve"><tspan class="t">  Emit the state document on stdout, suppress every prompt, and never write data</tspan></text><text y="1045.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1087.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1129.8" xml:space="preserve"><tspan class="t">(-y, --yes)</tspan></text><text y="1171.8" xml:space="preserve"><tspan class="t">  A true or false value.</tspan></text><text y="1213.8" xml:space="preserve"><tspan class="t">  Pre-answer the read demo confirm and the org picker</tspan></text><text y="1255.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1297.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1339.8" xml:space="preserve"><tspan class="t">--status</tspan></text><text y="1381.8" xml:space="preserve"><tspan class="t">  A true or false value.</tspan></text><text y="1423.8" xml:space="preserve"><tspan class="t">  Report where you are without advancing any gate</tspan></text><text y="1465.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1507.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1549.8" xml:space="preserve"><tspan class="t">--skip connect | execute...</tspan></text><text y="1591.8" xml:space="preserve"><tspan class="t">  One of the following: connect, execute</tspan></text><text y="1633.8" xml:space="preserve"><tspan class="t">  Skip a step for this invocation only: connect or execute</tspan></text><text y="1675.8" xml:space="preserve"><tspan class="t">  This option may be repeated zero or more times.</tspan></text><text y="1717.8" xml:space="preserve"><tspan class="t">--reset</tspan></text><text y="1759.8" xml:space="preserve"><tspan class="t">  A true or false value.</tspan></text><text y="1801.8" xml:space="preserve"><tspan class="t">  Forget the recorded first execution and start the demo over</tspan></text><text y="1843.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1885.8" xml:space="preserve"><tspan class="t">  This setting is optional.</tspan></text><text y="1927.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t ca" style="fill:#c6d0f5;">█</tspan></text></g><g transform="translate(17680,0)"><text y="16.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t"># Show onboard subcommand help</tspan></text><text y="37.8" xml:space="preserve"><tspan class="t p">&gt; </tspan><tspan class="t">composio onboard --help</tspan></text><text y="58.8" xml:space="preserve"><tspan class="t w">composio</tspan></text><text y="100.8" xml:space="preserve"><tspan class="t">composio 0.3.0</tspan></text><text y="142.8" xml:space="preserve"><tspan class="t">USAGE</tspan></text><text y="184.8" xml:space="preserve"><tspan class="t">$ onboard [--toolkit text] [--task text] [--json] [(-y, --yes)] [--status] --skip connect | execute... [--reset]</tspan></text><text y="226.8" xml:space="pr