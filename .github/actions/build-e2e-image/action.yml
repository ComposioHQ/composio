name: 'Build E2E Docker image'
description: 'Builds an E2E test image with Buildx, restoring and saving layers through the GitHub Actions cache'

inputs:
  dockerfile:
    description: 'Path to the Dockerfile, relative to the repository root'
    required: true
  tag:
    description: 'Tag for the image loaded into the local Docker daemon'
    required: true
  cache-scope:
    description: 'GitHub Actions cache scope. Use one scope per image variant so matrix jobs do not overwrite each other'
    required: true
  cache-target:
    description: >-
      Build stage whose layers are saved to the cache. Set it on images that
      copy the workspace in later stages: those layers change on every commit,
      so saving them would only evict caches that do get restored. Leave empty
      to save every layer.
    required: false
    default: ''
  build-args:
    description: 'Newline-separated KEY=VALUE build arguments'
    required: false
    default: ''
  labels:
    description: 'Newline-separated KEY=VALUE image labels'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # The default `docker` driver cannot export to the GitHub Actions cache.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # `ignore-error` keeps a cache-service outage from failing the build.
    - name: Build and cache the ${{ inputs.cache-target }} stage
      if: inputs.cache-target != ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.cache-target }}
        build-args: ${{ inputs.build-args }}
        provenance: false
        outputs: type=cacheonly
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max,ignore-error=true

    - name: Build ${{ inputs.tag }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        labels: ${{ inputs.labels }}
        tags: ${{ inputs.tag }}
        provenance: false
        load: true
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: ${{ inputs.cache-target == '' && format('type=gha,scope={0},mode=max,ignore-error=true', inputs.cache-scope) || '' }}
