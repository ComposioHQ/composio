name: 'Build E2E Docker image'
description: 'Builds an E2E test image with Buildx, restoring and saving layers through the GitHub Actions cache'

inputs:
  dockerfile:
    description: 'Path to the Dockerfile, relative to the repository root'
    required: true
  tag:
    description: 'Tag for the image loaded into the local Docker daemon'
    required: true
  cache-scope:
    description: 'GitHub Actions cache scope. Use one scope per image variant so matrix jobs do not overwrite each other'
    required: true
  cache-target:
    description: >-
      Build stage whose layers are saved to the cache. Set it on images that
      copy the workspace in later stages: those layers change on every commit,
      so saving them would only evict caches that do get restored. Leave empty
      to save every layer.
    required: false
    default: ''
  build-args:
    description: 'Newline-separated KEY=VALUE build arguments'
    required: false
    default: ''
  labels:
    description: 'Newline-separated KEY=VALUE image labels'
    required: false
    default: ''
  build-retries:
    description: >-
      Number of attempts for each Buildx build. Base-image resolution from ECR
      Public can fail with HTTP 429 anonymous rate limits, so failed builds are
      retried with linear backoff.
    required: false
    default: '3'

runs:
  using: 'composite'
  steps:
    # The default `docker` driver cannot export to the GitHub Actions cache.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and cache the ${{ inputs.cache-target }} stage (with retries)
      if: inputs.cache-target != ''
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        CACHE_TARGET: ${{ inputs.cache-target }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        BUILD_ARGS: ${{ inputs.build-args }}
        BUILD_RETRIES: ${{ inputs.build-retries }}
      run: |
        set -euo pipefail

        if ! [[ "$BUILD_RETRIES" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::build-retries must be a positive integer, got '${BUILD_RETRIES}'"
          exit 1
        fi

        args=(--file "$DOCKERFILE" --target "$CACHE_TARGET" --output type=cacheonly)
        args+=(--cache-from "type=gha,scope=${CACHE_SCOPE}")
        # `ignore-error` keeps a cache-service outage from failing the build.
        args+=(--cache-to "type=gha,scope=${CACHE_SCOPE},mode=max,ignore-error=true")
        args+=(--provenance=false)
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          case "$line" in \#*) continue ;; esac
          args+=(--build-arg "$line")
        done <<<"$BUILD_ARGS"

        # ECR Public anonymous pull limits (HTTP 429, shared per runner IP) are
        # why the build is retried with linear backoff.
        attempt=1
        while [ "$attempt" -le "$BUILD_RETRIES" ]; do
          attempt_args=("${args[@]}")
          if [ "$attempt" -eq "$BUILD_RETRIES" ]; then
            # mirror.gcr.io serves byte-identical digest-pinned manifests from a
            # different IP pool, so a final attempt there can clear persistent ECR 429s.
            attempt_args+=(--build-arg "BASE_REGISTRY=mirror.gcr.io/library")
          fi
          set +e
          docker buildx build "${attempt_args[@]}" .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$attempt" -lt "$BUILD_RETRIES" ]; then
            backoff=$((10 * attempt))
            echo "::warning::docker buildx build attempt ${attempt}/${BUILD_RETRIES} failed with exit code ${status}; retrying in ${backoff}s"
            sleep "$backoff"
          fi
          attempt=$((attempt + 1))
        done
        echo "::error::docker buildx build failed after ${BUILD_RETRIES} attempts; base-image resolution may still be rate-limited by ECR Public"
        exit "$status"

    - name: Build ${{ inputs.tag }} (with retries)
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        TAG: ${{ inputs.tag }}
        CACHE_TARGET: ${{ inputs.cache-target }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        BUILD_ARGS: ${{ inputs.build-args }}
        LABELS: ${{ inputs.labels }}
        BUILD_RETRIES: ${{ inputs.build-retries }}
      run: |
        set -euo pipefail

        if ! [[ "$BUILD_RETRIES" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::build-retries must be a positive integer, got '${BUILD_RETRIES}'"
          exit 1
        fi

        args=(--file "$DOCKERFILE" --tag "$TAG" --load --provenance=false)
        args+=(--cache-from "type=gha,scope=${CACHE_SCOPE}")
        if [ -z "$CACHE_TARGET" ]; then
          # `ignore-error` keeps a cache-service outage from failing the build.
          args+=(--cache-to "type=gha,scope=${CACHE_SCOPE},mode=max,ignore-error=true")
        fi
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          case "$line" in \#*) continue ;; esac
          args+=(--label "$line")
        done <<<"$LABELS"
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          case "$line" in \#*) continue ;; esac
          args+=(--build-arg "$line")
        done <<<"$BUILD_ARGS"

        # ECR Public anonymous pull limits (HTTP 429, shared per runner IP) are
        # why the build is retried with linear backoff.
        attempt=1
        while [ "$attempt" -le "$BUILD_RETRIES" ]; do
          attempt_args=("${args[@]}")
          if [ "$attempt" -eq "$BUILD_RETRIES" ]; then
            # mirror.gcr.io serves byte-identical digest-pinned manifests from a
            # different IP pool, so a final attempt there can clear persistent ECR 429s.
            attempt_args+=(--build-arg "BASE_REGISTRY=mirror.gcr.io/library")
          fi
          set +e
          docker buildx build "${attempt_args[@]}" .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$attempt" -lt "$BUILD_RETRIES" ]; then
            backoff=$((10 * attempt))
            echo "::warning::docker buildx build attempt ${attempt}/${BUILD_RETRIES} failed with exit code ${status}; retrying in ${backoff}s"
            sleep "$backoff"
          fi
          attempt=$((attempt + 1))
        done
        echo "::error::docker buildx build failed after ${BUILD_RETRIES} attempts; base-image resolution may still be rate-limited by ECR Public"
        exit "$status"
