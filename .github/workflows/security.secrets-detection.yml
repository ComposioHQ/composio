name: Secrets Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - next

permissions:
  contents: read

jobs:
  secrets:
    # The called reusable workflow declares these scopes; a narrower caller
    # grant clamps its token and the secret-scanning check 403s into a warning.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
    uses: ComposioHQ/.github/.github/workflows/secrets-detection.yml@7dc23a1c1c850570499a4a87f272712463fa8dcb # master
    secrets: inherit
    with:
      slack_channel: "buzz-security"
