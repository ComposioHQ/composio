name: Secrets Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - next

permissions:
  contents: read

jobs:
  secrets:
    # The called reusable workflow declares these scopes; a narrower caller
    # grant clamps its token and the secret-scanning check 403s into a warning.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
    uses: ComposioHQ/.github/.github/workflows/secrets-detection.yml@8e84ebf6453f2e4a4699b41285575605def79eb9 # fix/pin-secrets-detection-actions (ComposioHQ/.github#12)
    secrets: inherit
    with:
      slack_channel: "buzz-security"
