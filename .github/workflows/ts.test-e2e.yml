name: E2E Test Typescript SDK

on:
  push:
    branches: [master, next, main]
    paths:
      - 'ts/**'
      # A catalog pin or lockfile change swaps what every ts/** package
      # resolves without touching one of their files -- @composio/client
      # 0.1.0-alpha.76 -> 2.0.0-rc.5 skipped this suite entirely that way.
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-node-pnpm-bun/action.yml'
      - '.github/actions/build-e2e-image/action.yml'
      - '.github/workflows/ts.test-e2e.yml'
      - 'mise.toml'
      - 'mise.lock'
      - 'toolchain-versions.json'
  pull_request:
    paths:
      - 'ts/**'
      # A catalog pin or lockfile change swaps what every ts/** package
      # resolves without touching one of their files -- @composio/client
      # 0.1.0-alpha.76 -> 2.0.0-rc.5 skipped this suite entirely that way.
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-node-pnpm-bun/action.yml'
      - '.github/actions/build-e2e-image/action.yml'
      - '.github/workflows/ts.test-e2e.yml'
      - 'mise.toml'
      - 'mise.lock'
      - 'toolchain-versions.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Print Turborepo telemetry events to the logs instead of sending them.
env:
  TURBO_TELEMETRY_DEBUG: 1

jobs:
  toolchain-versions:
    name: Read toolchain test matrix
    runs-on: ubuntu-24.04
    permissions: read-all
    outputs:
      node: ${{ steps.versions.outputs.node }}
      node-digests: ${{ steps.versions.outputs.node-digests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions
        id: versions
        run: |
          echo "node=$(jq -c '.node' toolchain-versions.json)" >> "$GITHUB_OUTPUT"
          echo "node-digests=$(jq -c .nodeDigests toolchain-versions.json)" >> "$GITHUB_OUTPUT"

  # Node.js E2E tests, running in Docker to isolate environment
  # Each test suite defines its own versions.node in e2e.test.ts
  # Tests that don't support the matrix version are automatically skipped
  test-e2e-node-docker:
    name: E2E Test Node.js ${{ matrix.node-version }}
    needs: toolchain-versions
    runs-on: ubuntu-24.04
    permissions: read-all
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.toolchain-versions.outputs.node) }}
    env:
      CI: 1
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_BASE_URL: ${{ secrets.COMPOSIO_BASE_URL_STAGING }}
      COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
      COMPOSIO_E2E_NODE_VERSION: ${{ matrix.node-version }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize Composio API keys
        run: |
          {
            echo "COMPOSIO_USER_API_KEY=${COMPOSIO_USER_API_KEY}"
            echo "COMPOSIO_API_KEY=${COMPOSIO_API_KEY}"
            echo "COMPOSIO_BASE_URL=${COMPOSIO_BASE_URL}"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js, pnpm, Bun
        id: setup-toolchain
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-turbo-cache: 'true'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:packages

      - name: Check API keys
        id: api-keys
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          missing=()
          for name in COMPOSIO_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_ACTOR" = "dependabot[bot]" ] || [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice::Skipping secret-backed E2E tests; missing ${missing[*]}."
              exit 0
            fi

            printf '::error::%s is not set\n' "${missing[@]}"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "✅ API keys are configured"

      - name: Pre-build Docker image for e2e tests
        if: steps.api-keys.outputs.available == 'true'
        uses: ./.github/actions/build-e2e-image
        with:
          dockerfile: ts/e2e-tests/_utils/Dockerfile.node
          tag: composio-e2e-node:${{ matrix.node-version }}
          cache-scope: e2e-node-${{ matrix.node-version }}
          cache-target: toolchain
          build-args: |
            NODE_VERSION=${{ matrix.node-version }}
            NODE_VERSION_DIGEST=${{ fromJSON(needs.toolchain-versions.outputs.node-digests)[matrix.node-version] }}
          labels: |
            composio.e2e=true
            composio.runtime=node
            composio.node_version=${{ matrix.node-version }}

      - name: Run Node.js E2E Tests
        if: steps.api-keys.outputs.available == 'true'
        run: pnpm run test:e2e:node

  # CLI E2E tests, running in scratch Docker to isolate environment
  test-e2e-cli-docker:
    name: E2E Test CLI (scratch)
    needs: toolchain-versions
    runs-on: ubuntu-24.04
    permissions: read-all
    env:
      CI: 1
      COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_BASE_URL: ${{ secrets.COMPOSIO_BASE_URL_STAGING }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize Composio API keys
        run: |
          {
            echo "COMPOSIO_USER_API_KEY=${COMPOSIO_USER_API_KEY}"
            echo "COMPOSIO_API_KEY=${COMPOSIO_API_KEY}"
            echo "COMPOSIO_BASE_URL=${COMPOSIO_BASE_URL}"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js, pnpm, Bun
        id: setup-toolchain
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-turbo-cache: 'true'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:packages

      - name: Check API keys
        id: api-keys
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          missing=()
          for name in COMPOSIO_API_KEY OPENAI_API_KEY COMPOSIO_USER_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_ACTOR" = "dependabot[bot]" ] || [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice::Skipping secret-backed E2E tests; missing ${missing[*]}."
              exit 0
            fi

            printf '::error::%s is not set\n' "${missing[@]}"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "✅ API keys are configured"

      - name: Read CLI version
        id: cli-version
        run: |
          CLI_VERSION=$(node -p "require('./ts/packages/cli/package.json').version")
          echo "COMPOSIO_E2E_CLI_VERSION=${CLI_VERSION}" >> "$GITHUB_ENV"
          echo "value=${CLI_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pre-build Docker image for CLI e2e tests
        uses: ./.github/actions/build-e2e-image
        with:
          dockerfile: ts/e2e-tests/_utils/Dockerfile.cli
          tag: composio-e2e-cli:${{ steps.cli-version.outputs.value }}
          cache-scope: e2e-cli
          cache-target: toolchain
          # The CLI node version comes from mise.lock and must stay present in
          # both `node` and `nodeDigests` of toolchain-versions.json, or the
          # digest lookup yields an empty pin.
          build-args: |
            CLI_VERSION=${{ steps.cli-version.outputs.value }}
            NODE_VERSION=${{ steps.setup-toolchain.outputs.node-version }}
            NODE_VERSION_DIGEST=${{ fromJSON(needs.toolchain-versions.outputs.node-digests)[steps.setup-toolchain.outputs.node-version] }}
          labels: |
            composio.e2e=true
            composio.runtime=cli
            composio.cli_version=${{ steps.cli-version.outputs.value }}

      - name: Run CLI E2E Tests
        if: steps.api-keys.outputs.available == 'true'
        run: pnpm run test:e2e:cli

  # Cloudflare Workerd E2E tests
  test-e2e-cloudflare:
    name: E2E Test Cloudflare Workerd
    runs-on: ubuntu-24.04
    permissions: read-all
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_BASE_URL: ${{ secrets.COMPOSIO_BASE_URL_STAGING }}
      COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize Composio API keys
        run: |
          {
            echo "COMPOSIO_USER_API_KEY=${COMPOSIO_USER_API_KEY}"
            echo "COMPOSIO_API_KEY=${COMPOSIO_API_KEY}"
            echo "COMPOSIO_BASE_URL=${COMPOSIO_BASE_URL}"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-turbo-cache: 'true'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:packages

      - name: Check API keys
        id: api-keys
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          missing=()
          for name in COMPOSIO_API_KEY OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_ACTOR" = "dependabot[bot]" ] || [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice::Skipping secret-backed E2E tests; missing ${missing[*]}."
              exit 0
            fi

            printf '::error::%s is not set\n' "${missing[@]}"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "✅ API keys are configured"

      - name: Run Cloudflare Workers E2E Tests
        if: steps.api-keys.outputs.available == 'true'
        run: pnpm run test:e2e:cloudflare
        env:
          COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_BASE_URL: ${{ secrets.COMPOSIO_BASE_URL_STAGING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
