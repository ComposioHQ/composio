name: Docs - Repair KB Semantic Artifact

# KB guides are published by the support portal through docs-kb-publish.yml.
# This six-hour run repairs kb/semantic-index.json when docs or guide changes
# landed on next without a rebuild (fork PRs, or a publication that merged
# before docs-rebuild-kb-semantic.yml finished).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with portal publications so each run starts from a settled next.
  group: docs-kb-publication
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_base_sha: ${{ steps.docs-base.outputs.sha }}
      changed: ${{ steps.semantic.outputs.stale }}
    defaults:
      run:
        working-directory: ./docs

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          persist-credentials: false

      - name: Record docs base
        id: docs-base
        run: |
          docs_base_sha=$(git rev-parse HEAD)
          echo "sha=$docs_base_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Detect stale semantic artifact
        id: semantic
        run: |
          if bun scripts/build-kb-semantic-index.ts --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Semantic artifact is stale against the checked-in docs corpus."
          fi

      - name: Rebuild generated pages and semantic artifact
        if: steps.semantic.outputs.stale == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bun run build:kb-semantic

      - name: Verify rebuilt knowledge base
        if: steps.semantic.outputs.stale == 'true'
        run: |
          bun run verify:kb
          bun run check:kb-semantic

      - name: Upload verified KB artifacts
        if: steps.semantic.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kb-semantic-repair
          path: docs/kb/
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Apply the artifacts relative to the exact tree that produced them.
          ref: ${{ needs.refresh.outputs.docs_base_sha }}
          persist-credentials: false

      - name: Download verified KB artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kb-semantic-repair
          path: docs

      - name: Generate composio PR token
        id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ComposioHQ
          repositories: composio
          permission-contents: write
          permission-pull-requests: write

      - name: Create repair pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.write-token.outputs.token }}
          commit-message: 'docs(kb): rebuild stale semantic artifact'
          title: 'docs(kb): rebuild stale semantic artifact'
          body: |
            Automated rebuild of `docs/kb/semantic-index.json` after docs or KB guide changes landed on `next` without one.

            - Reused unchanged vectors and embedded only changed records
            - Ran KB freshness and semantic-artifact verification
          branch: docs/auto-update-kb
          base: next
          add-paths: |
            docs/kb/

  # Rebuild and PR creation are one pipeline. Report after both jobs so a
  # successful rebuild cannot hide a failed proposal, and close the issue only
  # after every required stage has recovered.
  report:
    needs: [refresh, propose]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open KB repair failure issue
        if: needs.refresh.result == 'failure' || needs.propose.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: docs-kb-refresh-failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          PROPOSE_RESULT: ${{ needs.propose.result }}
        run: |
          gh label create "$LABEL" \
            --color B60205 \
            --description "Scheduled KB semantic artifact repair is failing" 2>/dev/null || true

          existing=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open for this failure; not filing a duplicate."
            exit 0
          fi

          gh issue create \
            --title "KB semantic artifact repair is failing" \
            --label "$LABEL" \
            --body "The scheduled KB semantic artifact repair failed.

          - Run: $RUN_URL
          - Trigger: \`$EVENT_NAME\`
          - Rebuild job: \`$REFRESH_RESULT\`
          - Proposal job: \`$PROPOSE_RESULT\`

          **Impact:** KB search answers new or changed content with keyword results
          only until this workflow recovers.

          **First checks:** verify that \`OPENAI_API_KEY\` is set and that the Release
          Bot GitHub App can write the repair branch and PR in \`ComposioHQ/composio\`."

      - name: Close KB repair failure issue
        if: needs.refresh.result == 'success' && (needs.refresh.outputs.changed != 'true' || needs.propose.result == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: docs-kb-refresh-failure
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The KB semantic artifact repair recovered in run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
