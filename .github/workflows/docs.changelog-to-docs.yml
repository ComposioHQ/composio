name: Changelog → Docs PR

on:
  push:
    branches: [next]
    paths:
      - 'docs/content/changelog/**.mdx'

permissions:
  contents: read

concurrency:
  group: changelog-docs-${{ github.event.after }}
  cancel-in-progress: false

jobs:
  suggest-docs-updates:
    name: Suggest Documentation Updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve verified changelog finalization
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            FILES=$(git diff --name-only --diff-filter=AM HEAD^..HEAD | grep '^docs/content/changelog/.*\.mdx$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE".."$AFTER" | grep '^docs/content/changelog/.*\.mdx$' || true)
          fi

          printf '%s\n' "$FILES" | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(length > 0))' \
            > changed-files.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$AFTER/pulls" \
            --paginate --slurp | jq 'add' > associated-prs.json
          jq '[.[] | {
              number,
              state:(if .merged_at != null then "MERGED" elif .state == "open" then "OPEN" else "CLOSED" end),
              head_ref:.head.ref,
              base_ref:.base.ref,
              body:(.body // ""),
              merge_commit_sha:(.merge_commit_sha // null)
            }]' associated-prs.json > finalization-prs.json
          pr_number=$(jq -r \
            '[.[] | select(.body // "" | test("<!-- sdk-release-finalization:[a-f0-9]{64} -->"))] |
             if length == 1 then .[0].number else "" end' associated-prs.json)
          if [[ -n "$pr_number" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
              --paginate --slurp | jq '[add[] | {
                body:(.body // ""),
                author_login:(.user.login // ""),
                author_type:(.user.type // "Unknown"),
                author_association:(.author_association // "NONE")
              }]' > existing-comments.json
          else
            echo '[]' > existing-comments.json
          fi
          bun .github/scripts/sdk-release/finalize-changelog.ts downstream \
            --pull-requests finalization-prs.json \
            --changed-files changed-files.json \
            --comments existing-comments.json \
            --trusted-login 'github-actions[bot]' \
            --channel docs \
            --output downstream-plan.json
          if [[ "$(jq -r .emit downstream-plan.json)" != "true" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number=$(jq -r .pull_request downstream-plan.json)
          manifest_id=$(jq -r .manifest_id downstream-plan.json)
          marker=$(jq -r .marker downstream-plan.json)
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$manifest_id" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "pull_request=$pr_number" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Codex updates docs
        if: steps.detect.outputs.found == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            A verified SDK changelog was merged to next for manifest ${{ steps.detect.outputs.manifest_id }}. Read the agent instructions and update documentation accordingly.

            1. Read docs/agent-guidance/agents/changelog-docs-updater.md for full instructions
            2. Read each of these changelog files:
            ${{ steps.detect.outputs.files }}
            3. For each change, search docs/content/docs/ for pages that need updating
            4. Make the documentation updates following the agent instructions
            5. If no docs changes are needed, make no file changes and explain why

      - name: Create PR if docs changed
        if: steps.detect.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No documentation changes needed"
            exit 0
          fi

          BRANCH="docs/changelog-update-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "docs: update documentation for new changelog entries"
          git push -u origin "$BRANCH"

          gh pr create \
            --base next \
            --head "$BRANCH" \
            --title "docs: update documentation for new changelog entries" \
            --reviewer "$GITHUB_ACTOR" \
            --body "$(cat <<'EOF'
          ## Summary
          Automated documentation updates triggered by new changelog entries merged to next.

          Generated by Codex via GitHub Actions.
          EOF
          )"

      - name: Record docs completion
        if: ${{ success() && steps.detect.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: ${{ steps.detect.outputs.marker }}
          PR_NUMBER: ${{ steps.detect.outputs.pull_request }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$MARKER

          Documentation follow-up completed by workflow run $GITHUB_RUN_ID."
