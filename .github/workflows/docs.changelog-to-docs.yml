name: Changelog → Docs PR

on:
  push:
    branches: [next]
    paths:
      - 'docs/content/changelog/**.mdx'

permissions:
  contents: read

jobs:
  suggest-docs-updates:
    name: Suggest Documentation Updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve verified changelog finalization
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            FILES=$(git diff --name-only --diff-filter=AM HEAD^..HEAD | grep '^docs/content/changelog/.*\.mdx$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE".."$AFTER" | grep '^docs/content/changelog/.*\.mdx$' || true)
          fi

          if [[ $(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l | tr -d ' ') != 1 ]]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$AFTER/pulls" \
            --paginate --slurp | jq 'add' > associated-prs.json
          jq '[.[] | select(
              .merged_at != null and
              .base.ref == "next" and
              (.head.ref | test("^release/sdk-[A-Za-z0-9._-]+-changelog$")) and
              (.body // "" | test("<!-- sdk-release-finalization:[a-f0-9]{64} -->"))
            )]' associated-prs.json > verified-prs.json
          test "$(jq length verified-prs.json)" = 1
          pr_number=$(jq -r '.[0].number' verified-prs.json)
          manifest_id=$(jq -r '.[0].body' verified-prs.json \
            | sed -n 's/.*<!-- sdk-release-finalization:\([a-f0-9]\{64\}\) -->.*/\1/p')
          test -n "$manifest_id"
          marker="<!-- sdk-release-docs:$manifest_id -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
            --paginate --slurp | jq 'add' > comments.json
          if jq -e --arg marker "$marker" '.[] | select(.body | startswith($marker))' comments.json >/dev/null; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr comment "$pr_number" --body "$marker

          Documentation follow-up claimed by workflow run $GITHUB_RUN_ID. This manifest will not emit a second docs update."
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$manifest_id" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Codex updates docs
        if: steps.detect.outputs.found == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            A verified SDK changelog was merged to next for manifest ${{ steps.detect.outputs.manifest_id }}. Read the agent instructions and update documentation accordingly.

            1. Read docs/agent-guidance/agents/changelog-docs-updater.md for full instructions
            2. Read each of these changelog files:
            ${{ steps.detect.outputs.files }}
            3. For each change, search docs/content/docs/ for pages that need updating
            4. Make the documentation updates following the agent instructions
            5. If no docs changes are needed, make no file changes and explain why

      - name: Create PR if docs changed
        if: steps.detect.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No documentation changes needed"
            exit 0
          fi

          BRANCH="docs/changelog-update-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "docs: update documentation for new changelog entries"
          git push -u origin "$BRANCH"

          gh pr create \
            --base next \
            --head "$BRANCH" \
            --title "docs: update documentation for new changelog entries" \
            --reviewer "$GITHUB_ACTOR" \
            --body "$(cat <<'EOF'
          ## Summary
          Automated documentation updates triggered by new changelog entries merged to next.

          Generated by Codex via GitHub Actions.
          EOF
          )"
