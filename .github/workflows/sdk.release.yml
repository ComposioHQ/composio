name: SDK release
run-name: SDK release (${{ github.actor }})

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      typescript:
        description: TypeScript bump (auto uses Changesets recommendations)
        type: choice
        options: [auto, patch, minor, major, skip]
        default: auto
      python:
        description: Python bump (auto uses Changesets recommendations)
        type: choice
        options: [auto, patch, minor, major, skip]
        default: auto
      supersede:
        description: Plan past the newest tagged release when some of its versions never reached the registry
        type: boolean
        default: false
  pull_request_target:
    branches: [next]
    types: [closed]
  push:
    tags: ['sdk-release/*']

permissions:
  contents: read
  actions: read

env:
  SDK_RELEASE_APP_ID: ${{ vars.SDK_RELEASE_APP_ID }}
  SDK_RELEASE_APP_SLUG: ${{ vars.SDK_RELEASE_APP_SLUG }}

jobs:
  authorize:
    if: >-
      github.repository == 'ComposioHQ/composio' &&
      github.event.repository.default_branch == 'next' &&
      github.ref == 'refs/heads/next' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && startsWith(github.event.issue.title, '[SDK release]')))
    runs-on: ubuntu-latest
    environment: sdk-release-control
    concurrency:
      group: sdk-release-controller
      cancel-in-progress: false
      queue: max
    outputs:
      prepare: ${{ steps.authorize.outputs.prepare }}
      batch: ${{ steps.authorize.outputs.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: sdk-token
        with:
          client-id: ${{ vars.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: ComposioHQ
          repositories: composio
      - name: Authorize member and freeze protected input
        id: authorize
        env:
          SDK_RELEASE_TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: bun scripts/sdk-release/batch.ts authorize
      - name: Retain authorized release input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.authorize.outputs.prepare == 'true'
        with:
          name: sdk-authorized-batch
          path: sdk-release-batch.json
          retention-days: 30
          if-no-files-found: error

  prepare:
    needs: authorize
    if: needs.authorize.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - uses: ./.github/actions/setup-python-uv
        with:
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            mise.lock
            python/pyproject.toml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install documentation generator dependencies
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read the authorized release input
        env:
          AUTHORIZED_BATCH: ${{ needs.authorize.outputs.batch }}
        run: mkdir -p /tmp/sdk-authorized-input && printenv AUTHORIZED_BATCH > /tmp/sdk-authorized-input/sdk-release-batch.json
      - name: Apply versions, locks and ordinary release documentation
        env:
          SDK_RELEASE_PATCH_PATH: /tmp/sdk-release-patch.json
        run: bun scripts/sdk-release/prepare.ts /tmp/sdk-authorized-input/sdk-release-batch.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-prepared-patch
          path: /tmp/sdk-release-patch.json
          retention-days: 30
          if-no-files-found: error

  release-pr:
    needs: [authorize, prepare]
    if: needs.authorize.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    environment: sdk-release-control
    concurrency:
      group: sdk-release-controller
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-authorized-batch
          path: /tmp/sdk-authorized
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-prepared-patch
          path: /tmp/sdk-prepared
      - run: mv /tmp/sdk-authorized/sdk-release-batch.json /tmp/sdk-authorized/batch.json && mv /tmp/sdk-prepared/sdk-release-patch.json /tmp/sdk-prepared/patch.json
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: sdk-token
        with:
          client-id: ${{ vars.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: ComposioHQ
          repositories: composio
      - name: Validate release-only diff and commit through the App API
        env:
          SDK_RELEASE_TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: bun scripts/sdk-release/batch.ts commit

  source-tag:
    # pull_request_target executes protected-next code, never the PR checkout.
    if: >-
      github.repository == 'ComposioHQ/composio' &&
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/next' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'sdk-release/batch-')
    runs-on: ubuntu-latest
    environment: sdk-release-control
    concurrency:
      group: sdk-release-controller
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: sdk-token
        with:
          client-id: ${{ vars.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: ComposioHQ
          repositories: composio
      - name: Verify final approval, checks and merge; create immutable source tag
        env:
          SDK_RELEASE_TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: bun scripts/sdk-release/batch.ts tag

  select-candidates:
    if: >-
      github.repository == 'ComposioHQ/composio' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-release/')
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.select.outputs.typescript }}
      python: ${{ steps.select.outputs.python }}
      languages: ${{ steps.select.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select planned language lanes
        id: select
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const batch = JSON.parse(readFileSync('.github/sdk-release-plan.json', 'utf8'));
          if (process.env.SOURCE_TAG !== `sdk-release/${batch.id}`) throw new Error('Tag does not identify the committed release');
          const languages = [...new Set(batch.plan.releases.map(release => release.language))];
          appendFileSync(process.env.GITHUB_OUTPUT, `languages=${JSON.stringify(languages)}\n`);
          for (const language of ['typescript', 'python']) appendFileSync(process.env.GITHUB_OUTPUT, `${language}=${languages.includes(language)}\n`);
          JS

  # Checks the approved release-PR candidates once and pins their artifact IDs and digests. Each
  # publish job downloads exactly those artifacts; "Re-run failed jobs" keeps this job's output.
  candidate:
    name: Approved candidates
    needs: select-candidates
    if: needs.select-candidates.outputs.typescript == 'true' || needs.select-candidates.outputs.python == 'true'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-caching: 'false'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pin the approved release-PR candidates
        id: approve
        env:
          SDK_READ_TOKEN: ${{ github.token }}
        run: bun scripts/sdk-release/candidates.ts approve

  candidates-ready:
    needs: [select-candidates, candidate]
    if: always() && needs.select-candidates.result == 'success' && needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected candidate before registry upload
        env:
          TYPESCRIPT: ${{ needs.select-candidates.outputs.typescript }}
          PYTHON: ${{ needs.select-candidates.outputs.python }}
        run: test "$TYPESCRIPT" = true || test "$PYTHON" = true

  publication-preflight:
    name: Check direct publication prerequisites
    needs: [select-candidates, candidate, candidates-ready]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify merged approval, tag rules, environments and every original candidate
        env:
          SDK_READ_TOKEN: ${{ github.token }}
          SDK_RELEASE_APP_ID: ${{ vars.SDK_RELEASE_APP_ID }}
          APPROVED_CANDIDATES: ${{ needs.candidate.outputs.approved }}
        run: bun scripts/sdk-release/registry.ts preflight

  # Each check exchanges an ID token for a publish token and discards it. Both publish jobs need
  # both checks, so a broken registration on either registry stops every upload.
  npm-publisher-preflight:
    name: Check npm trusted publisher
    needs: select-candidates
    if: needs.select-candidates.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exchange an ID token for each planned npm package
        run: bun scripts/sdk-release/registry.ts check-publisher typescript

  pypi-publisher-preflight:
    name: Check PyPI trusted publisher
    needs: select-candidates
    if: needs.select-candidates.outputs.python == 'true'
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exchange an ID token with PyPI
        run: bun scripts/sdk-release/registry.ts check-publisher python

  publish-npm:
    name: Publish original npm candidates
    needs:
      - select-candidates
      - candidate
      - publication-preflight
      - npm-publisher-preflight
      - pypi-publisher-preflight
    if: >-
      always() && needs.select-candidates.outputs.typescript == 'true' &&
      needs.publication-preflight.result == 'success' &&
      needs.npm-publisher-preflight.result == 'success' &&
      (needs.pypi-publisher-preflight.result == 'success' || (needs.pypi-publisher-preflight.result == 'skipped' && needs.select-candidates.outputs.python != 'true'))
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pin npm with native dist-tag OIDC support in the publisher only
        run: npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Upload original candidates to npm
        env:
          SDK_READ_TOKEN: ${{ github.token }}
          SDK_RELEASE_APP_ID: ${{ vars.SDK_RELEASE_APP_ID }}
          APPROVED_CANDIDATES: ${{ needs.candidate.outputs.approved }}
        run: bun scripts/sdk-release/registry.ts upload-npm

  publish-pypi:
    name: Publish original PyPI candidates
    needs:
      - select-candidates
      - candidate
      - publication-preflight
      - npm-publisher-preflight
      - pypi-publisher-preflight
    if: >-
      always() && needs.select-candidates.outputs.python == 'true' &&
      needs.publication-preflight.result == 'success' &&
      needs.pypi-publisher-preflight.result == 'success' &&
      (needs.npm-publisher-preflight.result == 'success' || (needs.npm-publisher-preflight.result == 'skipped' && needs.select-candidates.outputs.typescript != 'true'))
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reconcile all original files and prepare only missing Python distributions
        id: reconcile
        env:
          SDK_READ_TOKEN: ${{ github.token }}
          SDK_RELEASE_APP_ID: ${{ vars.SDK_RELEASE_APP_ID }}
          APPROVED_CANDIDATES: ${{ needs.candidate.outputs.approved }}
        run: bun scripts/sdk-release/registry.ts prepare-pypi
      - name: Upload original candidates to PyPI
        if: steps.reconcile.outputs.missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: sdk-publication/missing-python/

  registry-verification:
    name: Verify public SDK packages
    needs: [select-candidates, candidate, publication-preflight, publish-npm, publish-pypi]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-release/') &&
      needs.publication-preflight.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.select-candidates.outputs.typescript != 'true') &&
      (needs.publish-pypi.result == 'success' || needs.select-candidates.outputs.python != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - uses: ./.github/actions/setup-python-uv
        with:
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            mise.lock
            python/pyproject.toml
        if: needs.select-candidates.outputs.python == 'true'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify every public file, stable tag and native npm provenance
        env:
          SDK_READ_TOKEN: ${{ github.token }}
          SDK_RELEASE_APP_ID: ${{ vars.SDK_RELEASE_APP_ID }}
          APPROVED_CANDIDATES: ${{ needs.candidate.outputs.approved }}
        run: bun scripts/sdk-release/registry.ts verify
      - name: Verify fresh public installations, strict TypeScript, Python imports and typing, and dependency health
        run: bun scripts/sdk-release/consumers.ts

  # Runs after verification has concluded, so docs maintenance sees it succeeded, and keeps the
  # write token away from the job that installs third-party packages.
  announce-release:
    name: Announce the verified release
    needs: [registry-verification]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-release/') &&
      needs.registry-verification.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Report the published versions on the request issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sdk-release/tag-run.ts released
      - name: Start docs maintenance for this release
        id: docs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run docs.sdk-change-sync.yml --repo "$GITHUB_REPOSITORY" --ref next -f run_id="$RUN_ID"
      - name: Report that docs maintenance did not start
        if: steps.docs.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sdk-release/tag-run.ts docs-not-started

  report-failure:
    name: Report a failed release run
    needs:
      - select-candidates
      - candidate
      - candidates-ready
      - publication-preflight
      - npm-publisher-preflight
      - pypi-publisher-preflight
      - publish-npm
      - publish-pypi
      - registry-verification
    if: >-
      failure() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Name the failed jobs and the re-run on the request issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sdk-release/tag-run.ts failed
