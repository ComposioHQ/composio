name: SDK Release Coordinator (observe only)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Release operation'
        required: true
        type: choice
        options: [prepare, publish, resume, verify]
      release_id:
        description: 'Stable release identifier'
        required: true
        type: string
      scope:
        description: 'SDK ecosystems included in the release'
        required: true
        type: choice
        options: [typescript, python, combined]
      python_version:
        description: 'Exact PEP 440 version for Python-inclusive preparation'
        required: false
        type: string
      reset_changelog:
        description: 'Explicitly discard a generated draft and invalidate review'
        required: false
        default: false
        type: boolean
      real_api_canary:
        description: 'Run the explicit preparation-only Responses API canary'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'prepare' && format('sdk-release-prepare-{0}', inputs.release_id) || 'sdk-production' }}
  cancel-in-progress: false

env:
  SDK_RELEASE_PUBLISH_ENABLED: ${{ vars.SDK_RELEASE_PUBLISH_ENABLED }}
  PREPARATION_BASE: next
  PREPARATION_BRANCH: release/sdk-${{ inputs.release_id }}
  DRAFT_DIRECTORY: .github/sdk-release/drafts/

jobs:
  normalize-request:
    name: Normalize and validate request
    runs-on: ubuntu-latest
    outputs:
      request: ${{ steps.request.outputs.request }}
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Normalize UI/API dispatch
        id: request
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          args=(
            normalize-dispatch
            --operation "$OPERATION"
            --release-id "$RELEASE_ID"
            --scope "$RELEASE_SCOPE"
            --output request.json
          )
          if [[ -n "$PYTHON_VERSION" ]]; then
            args+=(--python-version "$PYTHON_VERSION")
          fi
          bun .github/scripts/sdk-release/update-preparation-pr.ts "${args[@]}"
          echo "request=$(jq -c . request.json)" >> "$GITHUB_OUTPUT"

      - name: Request summary
        run: |
          {
            echo "## SDK release request"
            echo
            echo '```json'
            jq . request.json
            echo '```'
            echo
            echo "Registry publisher switch: \`${SDK_RELEASE_PUBLISH_ENABLED:-false}\` (writers remain hard-disabled pending cutover)"
          } >> "$GITHUB_STEP_SUMMARY"

  unsupported-operation:
    name: Registry operations remain disabled
    needs: normalize-request
    if: ${{ inputs.operation != 'prepare' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed before any registry access
        run: |
          echo "::error::${{ inputs.operation }} is unavailable while the coordinator is observe-only"
          echo "SDK_RELEASE_PUBLISH_ENABLED=${SDK_RELEASE_PUBLISH_ENABLED:-false}"
          exit 1

  registry-publishers-disabled:
    name: Registry publishers disabled until cutover
    if: ${{ inputs.operation != 'prepare' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No registry publisher is implemented in the U4 observe-only coordinator."

  prepare:
    name: Build primary and verification artifact sets
    needs: normalize-request
    if: ${{ inputs.operation == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout primary preparation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0
          path: primary

      - name: Checkout verification-only preparation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0
          path: verification

      - name: Setup Node.js, pnpm, Bun
        uses: ./primary/.github/actions/setup-node-pnpm-bun
        with:
          node-version: '24.17.0'

      - name: Setup Python and uv
        uses: ./primary/.github/actions/setup-python-uv

      - name: Prepare both clean worktrees
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          git -C primary rev-parse HEAD > primary-base-commit.txt
          if [[ "$RELEASE_SCOPE" != "python" ]]; then
            bun --eval '
              import { readdirSync, readFileSync } from "node:fs";
              const changesets = readdirSync("primary/.changeset")
                .filter(name => name.endsWith(".md") && name !== "README.md")
                .map(name => {
                  const bytes = readFileSync(`primary/.changeset/${name}`, "utf8");
                  return { id: name.slice(0, -3), summary: bytes.replace(/^---[\\s\\S]*?---\\s*/, "").trim() };
                });
              await Bun.write("changelog-changesets.json", JSON.stringify(changesets, null, 2) + "\\n");
            '
            printf '[]\n' > changelog-pull-requests.json
          else
            printf '[]\n' > changelog-changesets.json
            gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base next --limit 20 \
              --json number,title,body,url,mergedAt,mergeCommit \
              | jq '[.[] | {
                  number,
                  title,
                  body:(.body // ""),
                  url,
                  merged_at:.mergedAt,
                  merge_commit_sha:.mergeCommit.oid
                }]' > changelog-pull-requests.json
          fi
          for worktree in primary verification; do
            (
              cd "$worktree"
              pnpm install --frozen-lockfile
              args=(--scope "$RELEASE_SCOPE")
              if [[ -n "$PYTHON_VERSION" ]]; then
                args+=(--python-version "$PYTHON_VERSION")
              fi
              bun .github/scripts/sdk-release/prepare.ts "${args[@]}" > "../$worktree-versions.json"
            )
          done
          diff -u <(jq -S . primary-versions.json) <(jq -S . verification-versions.json)

      - name: Build primary and verification-only artifacts
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git -C primary show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH TZ=UTC LC_ALL=C
          build_artifacts() {
            local worktree="$1"
            local label="$2"
            local output="$PWD/$label-artifacts"
            local descriptors="$PWD/$label-descriptors.ndjson"
            mkdir -p "$output"
            : > "$descriptors"

            if [[ "$RELEASE_SCOPE" != "python" ]]; then
              (cd "$worktree" && pnpm build:packages)
              while IFS= read -r package_name; do
                package_dir=$(cd "$worktree" && pnpm --filter "$package_name" exec pwd)
                packed=$(cd "$package_dir" && npm pack --json --pack-destination "$output" | jq -r '.[0].filename')
                filename=$(basename "$packed")
                sha256=$(shasum -a 256 "$output/$filename" | awk '{print $1}')
                integrity="sha512-$(openssl dgst -sha512 -binary "$output/$filename" | openssl base64 -A)"
                jq -nc \
                  --arg package_name "$package_name" \
                  --arg filename "$filename" \
                  --arg sha256 "$sha256" \
                  --arg integrity "$integrity" \
                  '{ecosystem:"typescript",package_name:$package_name,registry:"npm",filename:$filename,sha256:$sha256,integrity:$integrity}' \
                  >> "$descriptors"
              done < <(jq -r '.typescript_packages[].name' "$label-versions.json")
            fi

            if [[ "$RELEASE_SCOPE" != "typescript" ]]; then
              (cd "$worktree/python" && make env && make build)
              while IFS=$'\t' read -r package_name dist_dir; do
                while IFS= read -r artifact; do
                  filename=$(basename "$artifact")
                  cp "$artifact" "$output/$filename"
                  sha256=$(shasum -a 256 "$output/$filename" | awk '{print $1}')
                  jq -nc \
                    --arg package_name "$package_name" \
                    --arg filename "$filename" \
                    --arg sha256 "$sha256" \
                    '{ecosystem:"python",package_name:$package_name,registry:"pypi",filename:$filename,sha256:$sha256}' \
                    >> "$descriptors"
                done < <(find "$dist_dir" -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | sort)
              done < <(
                printf 'composio\t%s\n' "$worktree/python/dist"
                for provider in "$worktree"/python/providers/*; do
                  [[ -f "$provider/pyproject.toml" && -d "$provider/dist" ]] || continue
                  package_name=$(python -c 'import pathlib,tomllib,sys; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["project"]["name"])' "$provider/pyproject.toml")
                  printf '%s\t%s\n' "$package_name" "$provider/dist"
                done
              )
            fi

            jq -s 'sort_by(.filename, .package_name)' "$descriptors" > "$label-artifacts.json"
          }

          build_artifacts primary primary
          build_artifacts verification verification
          bun primary/.github/scripts/sdk-release/update-preparation-pr.ts compare-artifacts \
            --primary primary-artifacts.json \
            --verification verification-artifacts.json \
            --output reproducible-artifacts.json
          rm -rf verification-artifacts verification-descriptors.ndjson verification-artifacts.json

      - name: Capture independent legacy writer outcome
        run: |
          set -euo pipefail
          bun --eval '
            import { readFileSync } from "node:fs";
            import { readTypeScriptPackageMetadata } from "./primary/.github/scripts/sdk-release/collect-typescript-release.ts";
            const versions = JSON.parse(readFileSync("primary-versions.json", "utf8"));
            const metadata = readTypeScriptPackageMetadata("primary");
            const typescript = versions.typescript_packages.map(expected => {
              const observed = metadata.get(expected.name);
              if (!observed || observed.version !== expected.version) {
                throw new Error(`Legacy Changesets outcome drift for ${expected.name}`);
              }
              return {
                ecosystem: "typescript",
                name: expected.name,
                version: observed.version,
                registry: "npm",
                dist_tag: expected.dist_tag,
              };
            });
            const rootPyproject = readFileSync("primary/python/pyproject.toml", "utf8");
            const pythonVersion = /^version\\s*=\\s*"([^"]+)"/m.exec(rootPyproject)?.[1];
            const python = versions.python_packages.map(expected => {
              if (pythonVersion !== expected.version) {
                throw new Error(`Legacy Python build outcome drift for ${expected.name}`);
              }
              return {
                ecosystem: "python",
                name: expected.name,
                version: pythonVersion,
                registry: "pypi",
              };
            });
            await Bun.write(
              "legacy-packages.json",
              JSON.stringify([...typescript, ...python], null, 2) + "\\n",
            );
          '

      - name: Capture version patch and validated changelog input
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          (cd primary && git diff --binary) > preparation.patch
          cp primary-versions.json versions.json
          cp reproducible-artifacts.json artifacts.json
          bun --eval '
            import { collectChangelogInput } from "./primary/.github/scripts/sdk-release/collect-changelog-input.ts";
            import { readFileSync } from "node:fs";
            const versions = JSON.parse(readFileSync("versions.json", "utf8"));
            const changesets = JSON.parse(readFileSync("changelog-changesets.json", "utf8"));
            const pullRequests = JSON.parse(readFileSync("changelog-pull-requests.json", "utf8"));
            const packages = [...versions.typescript_packages, ...versions.python_packages];
            const input = collectChangelogInput({
              release_id: process.env.RELEASE_ID,
              date: new Date().toISOString().slice(0, 10),
              packages,
              changesets,
              pull_requests: pullRequests,
            });
            await Bun.write("changelog-input.json", JSON.stringify(input, null, 2) + "\\n");
          '

      - name: Upload primary preparation handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-primary-${{ inputs.release_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts.json
            changelog-input.json
            legacy-packages.json
            preparation.patch
            primary-base-commit.txt
            primary-artifacts/
            versions.json

      - name: Reproducibility summary
        run: |
          {
            echo "## Reproducible primary SDK artifacts"
            echo
            echo "| Ecosystem | Package | Artifact | SHA-256 | npm SRI |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.ecosystem) | `\(.package_name)` | `\(.filename)` | `\(.sha256)` | \(.integrity // "—") |"' artifacts.json
            echo
            echo "The verification-only build matched byte-for-byte and was discarded."
          } >> "$GITHUB_STEP_SUMMARY"

  generate-changelog:
    name: Generate validated changelog handoff
    needs: [normalize-request, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download validated primary handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-primary-${{ inputs.release_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Inspect exact stable preparation retry state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          git fetch origin next "$PREPARATION_BRANCH" || true
          remote_head=$(git ls-remote --heads origin "$PREPARATION_BRANCH" | awk '{print $1}')
          base_head=$(git rev-parse origin/next)
          gh pr list --state open --limit 100 --json number,headRefName,baseRefName,body \
            | jq '[.[] | {number,head_ref:.headRefName,base_ref:.baseRefName,body:(.body // "")}]' \
            > open-prs.json
          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg remote_head "$remote_head" \
            --arg base_head "$base_head" \
            --slurpfile pulls open-prs.json \
            '{
              release_id:$release_id,
              base_ref:"next",
              expected_remote_head:(if $remote_head == "" then $base_head else $remote_head end),
              remote_branch_head:(if $remote_head == "" then null else $remote_head end),
              open_pull_requests:$pulls[0]
            }' > retry-plan-input.json
          bun .github/scripts/sdk-release/update-preparation-pr.ts plan-pr \
            --input retry-plan-input.json \
            --output retry-plan.json
          printf '%s\n' "$remote_head" > handoff/existing-head.txt
          if [[ -n "$remote_head" ]]; then
            [[ "$(jq -r .action retry-plan.json)" == "update" ]] || {
              echo "::error::existing preparation branch has no exact compatible PR"
              exit 1
            }
            mkdir -p existing
            git show "origin/$PREPARATION_BRANCH:.github/sdk-release/manifests/$RELEASE_ID.json" \
              > existing/existing-manifest.json
            git show "origin/$PREPARATION_BRANCH:.github/sdk-release/drafts/$RELEASE_ID.mdx" \
              > existing/existing-draft.mdx
          fi

      - name: Generate strict structured changelog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REAL_API_CANARY: ${{ inputs.real_api_canary }}
          RESET_CHANGELOG: ${{ inputs.reset_changelog }}
        run: |
          set -euo pipefail
          bun --eval '
            import { existsSync, readFileSync } from "node:fs";
            import { generateChangelog } from "./.github/scripts/sdk-release/generate-changelog.ts";
            import { ManifestSchema } from "./.github/scripts/sdk-release/contracts.ts";
            import {
              assertPreparedBaseCommit,
              generationRecordFromManifest,
            } from "./.github/scripts/sdk-release/update-preparation-pr.ts";
            const input = JSON.parse(readFileSync("handoff/changelog-input.json", "utf8"));
            const primaryBaseCommit = readFileSync(
              "handoff/primary-base-commit.txt",
              "utf8",
            ).trim();
            const existingManifest = existsSync("existing/existing-manifest.json")
              ? ManifestSchema.parse(
                  JSON.parse(readFileSync("existing/existing-manifest.json", "utf8")),
                )
              : undefined;
            if (existingManifest) {
              assertPreparedBaseCommit(primaryBaseCommit, existingManifest.base_commit);
            }
            const existing = existingManifest
              ? {
                  draft: readFileSync("existing/existing-draft.mdx", "utf8"),
                  record: generationRecordFromManifest(existingManifest.openai_generation),
                }
              : undefined;
            const result = await generateChangelog({
              input,
              apiKey: process.env.OPENAI_API_KEY,
              existing,
              reset: process.env.RESET_CHANGELOG === "true",
            });
            if (result.action === "manual_merge_required") {
              throw new Error("Changelog input changed after a human edit; explicit reset or manual merge is required");
            }
            const draft = result.action === "generated" ? result.rendered.mdx : result.draft;
            const record = result.record;
            const reviewInvalidated = result.review_invalidated;
            if (process.env.RESET_CHANGELOG === "true" && existing && !reviewInvalidated) {
              throw new Error("Explicit changelog reset must invalidate prior review");
            }
            if (
              result.action !== "generated" &&
              result.action !== "no_op" &&
              result.action !== "preserved_human_edit"
            ) {
              throw new Error(`Unsupported generation retry action: ${result.action}`);
            }
            await Bun.write("handoff/changelog.mdx", draft);
            await Bun.write("handoff/changelog.json", JSON.stringify({
              action: result.action,
              record,
              review_invalidated: reviewInvalidated,
              canary: process.env.REAL_API_CANARY === "true",
            }, null, 2) + "\n");
          '

      - name: Upload secret-free writer handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-writer-${{ inputs.release_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: handoff/

  write-preparation:
    name: Update stable preparation PR
    needs: [normalize-request, prepare, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Checkout stable preparation lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download secret-free writer handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-writer-${{ inputs.release_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Validate exact PR lineage
        id: lineage
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          git fetch origin next "$PREPARATION_BRANCH" || true
          remote_head=$(git ls-remote --heads origin "$PREPARATION_BRANCH" | awk '{print $1}')
          expected_remote_head=$(tr -d '\n' < handoff/existing-head.txt)
          base_head=$(git rev-parse origin/next)
          if [[ "$remote_head" != "$expected_remote_head" ]]; then
            echo "::error::preparation branch advanced after changelog retry inspection"
            exit 1
          fi
          gh pr list --state open --limit 100 --json number,headRefName,baseRefName,body \
            | jq '[.[] | {number,head_ref:.headRefName,base_ref:.baseRefName,body:(.body // "")}]' \
            > open-prs.json
          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg remote_head "$remote_head" \
            --arg expected_remote_head "$expected_remote_head" \
            --arg base_head "$base_head" \
            --slurpfile pulls open-prs.json \
            '{
              release_id:$release_id,
              base_ref:"next",
              expected_remote_head:(if $expected_remote_head == "" then $base_head else $expected_remote_head end),
              remote_branch_head:(if $remote_head == "" then null else $remote_head end),
              open_pull_requests:$pulls[0]
            }' > pr-plan-input.json
          bun .github/scripts/sdk-release/update-preparation-pr.ts plan-pr \
            --input pr-plan-input.json \
            --output pr-plan.json
          echo "action=$(jq -r .action pr-plan.json)" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r '.pull_request_number // empty' pr-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Commit preparation bytes and push normally
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/remotes/origin/$PREPARATION_BRANCH"; then
            git checkout -B "$PREPARATION_BRANCH" "origin/$PREPARATION_BRANCH"
          else
            git checkout -B "$PREPARATION_BRANCH" origin/next
          fi
          if git apply --check handoff/preparation.patch; then
            git apply --index handoff/preparation.patch
          elif git apply --reverse --check handoff/preparation.patch; then
            echo "Exact preparation patch is already applied; preserving stable branch bytes."
          else
            echo "::error::preparation patch is partially applied or branch state is divergent"
            exit 1
          fi
          mkdir -p ".github/sdk-release/drafts" ".github/sdk-release/manifests"
          cp handoff/changelog.mdx ".github/sdk-release/drafts/$RELEASE_ID.mdx"
          bun --eval '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            import { SealedManifestSchema } from "./.github/scripts/sdk-release/contracts.ts";
            import { sealManifest } from "./.github/scripts/sdk-release/manifest.ts";
            import { assertPreparedBaseCommit } from "./.github/scripts/sdk-release/update-preparation-pr.ts";
            const versions = JSON.parse(readFileSync("handoff/versions.json", "utf8"));
            const artifacts = JSON.parse(readFileSync("handoff/artifacts.json", "utf8"));
            const changelog = JSON.parse(readFileSync("handoff/changelog.json", "utf8"));
            const primaryBaseCommit = readFileSync("handoff/primary-base-commit.txt", "utf8").trim();
            const draft = readFileSync(`.github/sdk-release/drafts/${process.env.RELEASE_ID}.mdx`, "utf8");
            const commandVersion = (command, args = ["--version"]) => {
              const result = Bun.spawnSync([command, ...args]);
              return result.exitCode === 0
                ? new TextDecoder().decode(result.stdout).trim()
                : null;
            };
            const manifest = SealedManifestSchema.parse({
              schema_version: "sdk-release-manifest/v1",
              phase: "sealed",
              release_id: process.env.RELEASE_ID,
              base_commit: primaryBaseCommit,
              selection: {
                typescript: versions.typescript_packages.length ? "selected" : "skipped",
                python: versions.python_packages.length ? "selected" : "skipped",
              },
              packages: [...versions.typescript_packages, ...versions.python_packages],
              artifacts,
              changeset_ids: versions.changeset_ids,
              python_release_family: versions.python_release_family,
              changelog: {
                draft_path: `.github/sdk-release/drafts/${process.env.RELEASE_ID}.mdx`,
                sha256: createHash("sha256").update(draft).digest("hex"),
              },
              openai_generation: { provider: "openai", ...changelog.record },
              toolchains: {
                node: process.version.slice(1),
                pnpm: commandVersion("pnpm"),
                python: commandVersion("python", ["--version"])?.replace(/^Python /, "") ?? null,
                uv: commandVersion("uv")?.replace(/^uv /, "") ?? null,
              },
              prepare_run: {
                repository: process.env.GITHUB_REPOSITORY,
                workflow: "sdk.release.yml",
                run_id: Number(process.env.GITHUB_RUN_ID),
                run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                commit_sha: primaryBaseCommit,
              },
            });
            assertPreparedBaseCommit(primaryBaseCommit, manifest.base_commit);
            const sealed = sealManifest(manifest);
            await Bun.write(`.github/sdk-release/manifests/${process.env.RELEASE_ID}.json`, sealed.canonical_bytes + "\n");
          '
          git add ".github/sdk-release/drafts/$RELEASE_ID.mdx" ".github/sdk-release/manifests/$RELEASE_ID.json"
          git -c user.name="composio-release-bot[bot]" \
              -c user.email="composio-release-bot[bot]@users.noreply.github.com" \
              commit -m "feat(release): prepare $RELEASE_ID"
          git push origin "HEAD:$PREPARATION_BRANCH"

      - name: Create or update exact preparation PR
        id: pull-request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          PLAN_ACTION: ${{ steps.lineage.outputs.action }}
          PLAN_NUMBER: ${{ steps.lineage.outputs.number }}
        run: |
          set -euo pipefail
          marker="<!-- sdk-release-preparation:$RELEASE_ID -->"
          body=$(printf '%s\n\n%s\n' \
            'Observe-only SDK release preparation. Registry publishers remain disabled.' \
            "$marker")
          if [[ "$PLAN_ACTION" == "create" ]]; then
            pr_url=$(gh pr create \
              --head "$PREPARATION_BRANCH" \
              --base next \
              --title "feat(release): prepare $RELEASE_ID" \
              --body "$body")
            number=${pr_url##*/}
          else
            number="$PLAN_NUMBER"
            gh pr edit "$number" --title "feat(release): prepare $RELEASE_ID" --body "$body"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Render and post durable preparation receipt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          bun --eval '
            import { readFileSync } from "node:fs";
            import { compareShadowPackages } from "./.github/scripts/sdk-release/update-preparation-pr.ts";
            import { computeManifestId } from "./.github/scripts/sdk-release/manifest.ts";
            const manifest = JSON.parse(readFileSync(`.github/sdk-release/manifests/${process.env.RELEASE_ID}.json`, "utf8"));
            const changelog = JSON.parse(readFileSync("handoff/changelog.json", "utf8"));
            const legacy = JSON.parse(readFileSync("handoff/legacy-packages.json", "utf8"));
            await Bun.write("receipt-input.json", JSON.stringify({
              release_id: manifest.release_id,
              manifest_id: computeManifestId(manifest),
              selection: manifest.selection,
              packages: manifest.packages,
              artifacts: manifest.artifacts,
              changelog: manifest.changelog,
              generation: {
                action: changelog.action,
                model: changelog.record.model,
                response_id: changelog.record.response_id,
                generation_key: changelog.record.generation_key,
                reset_count: changelog.record.reset_count,
                review_invalidated: changelog.review_invalidated,
              },
              prepare_run: {
                repository: process.env.GITHUB_REPOSITORY,
                run_id: Number(process.env.GITHUB_RUN_ID),
                run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              },
              legacy_comparison: compareShadowPackages(manifest.packages, legacy),
            }, null, 2) + "\n");
          '
          bun .github/scripts/sdk-release/receipt-comment.ts \
            --input receipt-input.json \
            --output receipt.md
          gh pr comment "$PR_NUMBER" --body-file receipt.md
          cat receipt.md >> "$GITHUB_STEP_SUMMARY"

  shadow-reconcile:
    name: Read-only registry reconciliation shadow
    needs: [prepare, write-preparation]
    if: ${{ inputs.operation == 'prepare' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/sdk-${{ inputs.release_id }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download sealed primary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-primary-${{ inputs.release_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Reconcile public registries without credentials or writes
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          status=0
          bun .github/scripts/sdk-release/reconcile.ts \
            --manifest ".github/sdk-release/manifests/$RELEASE_ID.json" \
            --artifact-directory handoff/primary-artifacts \
            --filtered-directory filtered \
            --output reconciliation.json || status=$?
          {
            echo "## Read-only registry shadow"
            echo
            echo "| Registry | Package | Version | State |"
            echo "| --- | --- | --- | --- |"
            jq -r '.observations[] | "| \(.registry) | `\(.package_name)` | `\(.version)` | \(.state) |"' reconciliation.json
            echo
            echo "No registry credentials or write operations were available to this job."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  resolve-sealed-release:
    name: Resolve merged sealed release and primary artifacts
    needs: normalize-request
    if: ${{ inputs.operation != 'prepare' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      manifest_id: ${{ steps.resolve.outputs.manifest_id }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      prepare_run_id: ${{ steps.resolve.outputs.prepare_run_id }}
      prepare_run_attempt: ${{ steps.resolve.outputs.prepare_run_attempt }}
      preparation_pull_request: ${{ steps.resolve.outputs.preparation_pull_request }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          node-version: '24.17.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve exact merged preparation lineage
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          marker="<!-- sdk-release-preparation:$RELEASE_ID -->"
          gh pr list \
            --state merged \
            --head "$PREPARATION_BRANCH" \
            --base next \
            --limit 10 \
            --json number,state,headRefName,baseRefName,body,mergeCommit \
            | jq '[.[] | {
                number,
                state,
                head_ref:.headRefName,
                base_ref:.baseRefName,
                body:(.body // ""),
                merge_commit_sha:.mergeCommit.oid
              }]' > merged-prs.json
          source_commit=$(jq -r --arg marker "$marker" \
            '[.[] | select(.state == "MERGED" and .head_ref == env.PREPARATION_BRANCH and .base_ref == "next" and (.body | contains($marker)))] | if length == 1 then .[0].merge_commit_sha else error("expected exactly one merged preparation PR") end' \
            merged-prs.json)
          git show "$source_commit:.github/sdk-release/manifests/$RELEASE_ID.json" \
            > sealed-manifest.json
          prepare_run_id=$(jq -r .prepare_run.run_id sealed-manifest.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prepare_run_id" \
            | jq --arg repository "$GITHUB_REPOSITORY" '{
                run_id:.id,
                run_attempt:.run_attempt,
                repository:$repository,
                workflow:(.path | split("/") | last),
                conclusion
              }' > prepare-run.json
          RELEASE_SOURCE_COMMIT="$source_commit" bun --eval '
            import { readFileSync } from "node:fs";
            import { resolveMergedRelease } from "./.github/scripts/sdk-release/finalize-receipt.ts";
            import { sealManifest } from "./.github/scripts/sdk-release/manifest.ts";
            const manifestBytes = readFileSync("sealed-manifest.json", "utf8");
            const manifest = JSON.parse(manifestBytes);
            if (sealManifest(manifest).canonical_bytes + "\n" !== manifestBytes) {
              throw new Error("Merged sealed manifest is not in canonical byte form");
            }
            const resolved = resolveMergedRelease({
              release_id: process.env.RELEASE_ID,
              repository: process.env.GITHUB_REPOSITORY,
              pull_requests: JSON.parse(readFileSync("merged-prs.json", "utf8")),
              manifest,
              prepare_run: JSON.parse(readFileSync("prepare-run.json", "utf8")),
            });
            if (resolved.source_commit !== process.env.RELEASE_SOURCE_COMMIT) {
              throw new Error("Merged release source changed during resolution");
            }
            await Bun.write("resolved-release.json", JSON.stringify(resolved, null, 2) + "\n");
          '
          git checkout --detach "$source_commit"
          bun --eval '
            import { readFileSync } from "node:fs";
            const listed = Bun.spawnSync(["pnpm", "list", "-r", "--depth", "-1", "--json"]);
            if (listed.exitCode !== 0) throw new Error("Unable to enumerate workspace packages");
            const packages = JSON.parse(new TextDecoder().decode(listed.stdout))
              .filter(item => item.name && item.path)
              .map(item => {
                const metadata = JSON.parse(readFileSync(`${item.path}/package.json`, "utf8"));
                const dependencies = new Set([
                  ...Object.keys(metadata.dependencies ?? {}),
                  ...Object.keys(metadata.optionalDependencies ?? {}),
                  ...Object.keys(metadata.peerDependencies ?? {}),
                ]);
                return { name:item.name, dependencies:[...dependencies].sort() };
              })
              .sort((left, right) => left.name.localeCompare(right.name));
            await Bun.write("workspace-packages.json", JSON.stringify(packages, null, 2) + "\n");
          '
          {
            echo "manifest_id=$(jq -r .manifest_id resolved-release.json)"
            echo "source_commit=$(jq -r .source_commit resolved-release.json)"
            echo "prepare_run_id=$(jq -r .prepare_run_id resolved-release.json)"
            echo "prepare_run_attempt=$(jq -r .prepare_run_attempt resolved-release.json)"
            echo "preparation_pull_request=$(jq -r .preparation_pull_request resolved-release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact prior prepare-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-primary-${{ inputs.release_id }}-${{ steps.resolve.outputs.prepare_run_attempt }}
          path: prepare-handoff
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.prepare_run_id }}
          github-token: ${{ github.token }}

      - name: Re-hash sealed artifacts before protected jobs
        run: |
          set -euo pipefail
          bun --eval '
            import { readFileSync } from "node:fs";
            import { SealedManifestSchema } from "./.github/scripts/sdk-release/contracts.ts";
            import { verifySealedArtifactDirectory } from "./.github/scripts/sdk-release/reconcile.ts";
            const manifest = SealedManifestSchema.parse(JSON.parse(readFileSync("sealed-manifest.json", "utf8")));
            verifySealedArtifactDirectory(manifest.artifacts, "prepare-handoff/primary-artifacts");
          '
          mkdir release-handoff
          cp sealed-manifest.json release-handoff/manifest.json
          cp resolved-release.json release-handoff/resolved.json
          cp workspace-packages.json release-handoff/workspace.json
          cp -R prepare-handoff/primary-artifacts release-handoff/artifacts

      - name: Upload revalidated sealed handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-sealed-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: release-handoff/

  preflight-reconcile:
    name: Reconcile sealed release before approval
    needs: resolve-sealed-release
    if: ${{ inputs.operation != 'prepare' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      can_publish: ${{ steps.reconcile.outputs.can_publish }}
      npm_count: ${{ steps.reconcile.outputs.npm_count }}
      pypi_count: ${{ steps.reconcile.outputs.pypi_count }}
      state: ${{ steps.reconcile.outputs.state }}
    steps:
      - name: Checkout sealed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sealed-release.outputs.source_commit }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          node-version: '24.17.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download sealed handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-sealed-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Build immutable registry matrix and filtered directories
        id: reconcile
        run: |
          set -euo pipefail
          status=0
          bun .github/scripts/sdk-release/reconcile.ts \
            --manifest handoff/manifest.json \
            --artifact-directory handoff/artifacts \
            --filtered-directory handoff/filtered \
            --output handoff/reconciliation.json || status=$?
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi
          can_publish=$(jq -r .can_publish handoff/reconciliation.json)
          npm_count=$(jq '.absent.npm | length' handoff/reconciliation.json)
          pypi_count=$(jq '.absent.pypi | length' handoff/reconciliation.json)
          state=$([[ "$can_publish" == "true" ]] && echo ready || echo conflict)
          {
            echo "can_publish=$can_publish"
            echo "npm_count=$npm_count"
            echo "pypi_count=$pypi_count"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Pending protected SDK deployment"
            echo
            echo "Sealed source: \`${{ needs.resolve-sealed-release.outputs.source_commit }}\`"
            echo "Manifest ID: \`${{ needs.resolve-sealed-release.outputs.manifest_id }}\`"
            echo "Changelog SHA-256: \`$(jq -r .changelog.sha256 handoff/manifest.json)\`"
            echo
            echo "| Registry | Package | Artifact | SHA-256 | npm SRI |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.artifacts[] | "| \(.registry) | `\(.package_name)` | `\(.filename)` | `\(.sha256)` | \(.integrity // "—") |"' handoff/manifest.json
            echo
            echo "Preflight state: **$state**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable publish handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-publish-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: handoff/

  publish-npm:
    name: Publish absent npm tarballs with OIDC
    needs: [resolve-sealed-release, preflight-reconcile]
    if: ${{ inputs.operation != 'prepare' && inputs.operation != 'verify' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false && needs.preflight-reconcile.outputs.can_publish == 'true' && needs.preflight-reconcile.outputs.npm_count != '0' }}
    runs-on: ubuntu-latest
    environment: sdk-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout sealed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sealed-release.outputs.source_commit }}

      - name: Setup trusted npm publisher
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          node-version: '24.17.0'

      - name: Require npm trusted-publisher support
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          node -e '
            const current = process.argv[1].split(".").map(Number);
            const [major = 0, minor = 0, patch = 0] = current;
            const valid =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            process.exit(valid ? 0 : 1);
          ' "$npm_version" || {
            echo "::error::npm 11.5.1 or newer is required for trusted publishing"
            exit 1
          }
          pnpm install --frozen-lockfile

      - name: Download absent-only publish handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-publish-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Publish absent npm tarballs in dependency order
        run: |
          bun .github/scripts/sdk-release/publish-npm.ts \
            --manifest handoff/manifest.json \
            --reconciliation handoff/reconciliation.json \
            --workspace handoff/workspace.json \
            --artifact-directory handoff/filtered/npm

  publish-pypi:
    name: Publish absent Python distributions with OIDC
    needs: [resolve-sealed-release, preflight-reconcile]
    if: ${{ inputs.operation != 'prepare' && inputs.operation != 'verify' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false && needs.preflight-reconcile.outputs.can_publish == 'true' && needs.preflight-reconcile.outputs.pypi_count != '0' }}
    runs-on: ubuntu-latest
    environment: sdk-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download absent-only publish handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-publish-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Publish absent Python distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: handoff/filtered/pypi
          skip-existing: false

  verify-publication:
    name: Verify exact public registry state
    needs: [resolve-sealed-release, preflight-reconcile, publish-npm, publish-pypi]
    if: ${{ always() && inputs.operation != 'prepare' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false && needs.resolve-sealed-release.result == 'success' && needs.preflight-reconcile.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.verify.outputs.state }}
    steps:
      - name: Checkout sealed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sealed-release.outputs.source_commit }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download publish handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-publish-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff

      - name: Poll exact registries even when publish directories were empty
        id: verify
        run: |
          set -euo pipefail
          bun --eval '
            import { readFileSync } from "node:fs";
            import { SealedManifestSchema } from "./.github/scripts/sdk-release/contracts.ts";
            import { reconcileRelease } from "./.github/scripts/sdk-release/reconcile.ts";
            import {
              RegistryConsistencyTimeoutError,
              verifyRegistryConsistency,
            } from "./.github/scripts/sdk-release/verify.ts";
            const manifest = SealedManifestSchema.parse(JSON.parse(readFileSync("handoff/manifest.json", "utf8")));
            const resolved = JSON.parse(readFileSync("handoff/resolved.json", "utf8"));
            const reconcile = () => reconcileRelease({
              manifest_id: resolved.manifest_id,
              packages: manifest.packages,
              artifacts: manifest.artifacts,
            });
            let plan;
            let state;
            try {
              plan = await verifyRegistryConsistency({ reconcile });
              state = plan.observations.some(item => item.state === "conflict")
                ? "conflict"
                : "verified";
            } catch (error) {
              if (!(error instanceof RegistryConsistencyTimeoutError) || !error.last_plan) throw error;
              plan = error.last_plan;
              state = "partial";
            }
            await Bun.write("verification.json", JSON.stringify({ state, plan }, null, 2) + "\n");
          '
          echo "state=$(jq -r .state verification.json)" >> "$GITHUB_OUTPUT"

      - name: Upload terminal verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-verification-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: verification.json

  finalize-release-attempt:
    name: Record attempt receipt and verified tags
    needs:
      [resolve-sealed-release, preflight-reconcile, publish-npm, publish-pypi, verify-publication]
    if: ${{ always() && inputs.operation != 'prepare' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false && needs.resolve-sealed-release.result == 'success' && needs.verify-publication.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.receipt.outputs.outcome }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Checkout sealed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sealed-release.outputs.source_commit }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download sealed evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-sealed-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Download verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-verification-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Post immutable attempt and update receipt index
        id: receipt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPERATION: ${{ inputs.operation }}
          PREPARATION_PR: ${{ needs.resolve-sealed-release.outputs.preparation_pull_request }}
          RELEASE_ID: ${{ inputs.release_id }}
          MANIFEST_ID: ${{ needs.resolve-sealed-release.outputs.manifest_id }}
          SOURCE_COMMIT: ${{ needs.resolve-sealed-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$PREPARATION_PR/comments" \
            --paginate --slurp | jq 'add' > existing-comments.json
          attempt=$(jq --arg prefix "<!-- sdk-release-attempt:$RELEASE_ID:" \
            '[.[] | select(.body | startswith($prefix))] | length + 1' existing-comments.json)
          started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          state=$(jq -r .state evidence/verification.json)
          from=$([[ "$state" == "conflict" ]] && echo preflight_reconciling || echo publishing)
          if [[ "${{ needs.publish-npm.result }}" == "cancelled" || "${{ needs.publish-pypi.result }}" == "cancelled" ]]; then
            state=partial
          fi
          echo "outcome=$state" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg manifest_id "${{ needs.resolve-sealed-release.outputs.manifest_id }}" \
            --arg operation "$OPERATION" \
            --arg started_at "$started_at" \
            --arg completed_at "$completed_at" \
            --arg from "$from" \
            --arg state "$state" \
            --argjson attempt "$attempt" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --slurpfile verification evidence/verification.json \
            '{
              schema_version:"sdk-release-attempt-receipt/v1",
              release_id:$release_id,
              manifest_id:$manifest_id,
              attempt:$attempt,
              operation:$operation,
              workflow_run_id:$run_id,
              workflow_run_attempt:$run_attempt,
              started_at:$started_at,
              completed_at:$completed_at,
              transition:{
                schema_version:"sdk-release-state-transition/v1",
                release_id:$release_id,
                from:$from,
                to:$state
              },
              observations:$verification[0].plan.observations,
              outcome:$state
            }' > attempt.json
          bun .github/scripts/sdk-release/finalize-receipt.ts attempt \
            --input attempt.json \
            --output attempt.md
          gh pr comment "$PREPARATION_PR" --body-file attempt.md

          gh api "repos/$GITHUB_REPOSITORY/issues/$PREPARATION_PR/comments" \
            --paginate --slurp | jq 'add' > receipt-comments.json
          bun --eval '
            import { readFileSync } from "node:fs";
            import { renderReceiptIndex } from "./.github/scripts/sdk-release/finalize-receipt.ts";
            const comments = JSON.parse(readFileSync("receipt-comments.json", "utf8"));
            const attempts = comments.flatMap(comment => {
              const marker = /<!-- sdk-release-attempt:[^:]+:(\d+) -->/.exec(comment.body);
              const outcome = /Outcome: \\*\\*(partial|conflict|verified|receipted|notified)\\*\\*/.exec(comment.body);
              const run = /Workflow run: `(\d+)`/.exec(comment.body);
              return marker && outcome && run
                ? [{ attempt:Number(marker[1]), outcome:outcome[1], workflow_run_id:Number(run[1]) }]
                : [];
            }).sort((left, right) => left.attempt - right.attempt);
            const body = renderReceiptIndex({
              release_id:process.env.RELEASE_ID,
              manifest_id:process.env.MANIFEST_ID,
              source_commit:process.env.SOURCE_COMMIT,
              attempts,
            });
            await Bun.write("index.md", body);
          '
          index_id=$(jq -r --arg marker "<!-- sdk-release-index:${{ needs.resolve-sealed-release.outputs.manifest_id }} -->" \
            '[.[] | select(.body | startswith($marker))] | if length == 0 then "" elif length == 1 then .[0].id else error("duplicate receipt indexes") end' \
            receipt-comments.json)
          if [[ -n "$index_id" ]]; then
            jq -n --rawfile body index.md '{body:$body}' \
              | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$index_id" --input -
          else
            gh pr comment "$PREPARATION_PR" --body-file index.md
          fi

      - name: Upload immutable attempt receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-attempt-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: attempt.json

      - name: Create or reuse verified annotated tags
        if: ${{ needs.verify-publication.outputs.state == 'verified' }}
        env:
          MANIFEST_ID: ${{ needs.resolve-sealed-release.outputs.manifest_id }}
          SOURCE_COMMIT: ${{ needs.resolve-sealed-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          bun --eval '
            import { readFileSync } from "node:fs";
            import { planReleaseTags } from "./.github/scripts/sdk-release/finalize-tags.ts";
            const manifest = JSON.parse(readFileSync("evidence/manifest.json", "utf8"));
            const names = [
              ...manifest.packages
                .filter(item => item.ecosystem === "typescript")
                .map(item => `${item.name}@${item.version}`),
              ...new Set(
                manifest.packages
                  .filter(item => item.ecosystem === "python")
                  .map(item => `py@${item.version}`)
              ),
            ];
            const existing_tags = names.flatMap(name => {
              const target = Bun.spawnSync(["git", "rev-list", "-n", "1", name]);
              if (target.exitCode !== 0) return [];
              const message = Bun.spawnSync(["git", "for-each-ref", "--format=%(contents)", `refs/tags/${name}`]);
              return [{
                name,
                target:new TextDecoder().decode(target.stdout).trim(),
                message:new TextDecoder().decode(message.stdout).trim(),
              }];
            });
            const plan = planReleaseTags({
              manifest,
              manifest_id:process.env.MANIFEST_ID,
              source_commit:process.env.SOURCE_COMMIT,
              verified:true,
              existing_tags,
            });
            for (const tag of plan) {
              const created = Bun.spawnSync(["git", "tag", "-a", tag.name, tag.target, "-m", tag.message]);
              if (created.exitCode !== 0) throw new Error(`Unable to create ${tag.name}`);
              const pushed = Bun.spawnSync(["git", "push", "origin", `refs/tags/${tag.name}`]);
              if (pushed.exitCode !== 0) throw new Error(`Unable to push ${tag.name}`);
            }
          '

  finalize-public-changelog:
    name: Finalize verified public changelog
    needs: [resolve-sealed-release, finalize-release-attempt]
    if: ${{ inputs.operation != 'prepare' && vars.SDK_RELEASE_PUBLISH_ENABLED == 'true' && false && needs.finalize-release-attempt.outputs.outcome == 'verified' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Checkout sealed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sealed-release.outputs.source_commit }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download sealed release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-sealed-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Download verified attempt receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-attempt-${{ inputs.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Plan exact changelog finalization
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          branch="release/sdk-$RELEASE_ID-changelog"
          git fetch origin next "$branch" --no-tags || git fetch origin next --no-tags
          gh pr list \
            --state all \
            --base next \
            --head "$branch" \
            --json number,state,headRefName,baseRefName,body,mergeCommit \
            --limit 100 \
            | jq '[.[] | {
                number,
                state,
                head_ref:.headRefName,
                base_ref:.baseRefName,
                body:(.body // ""),
                merge_commit_sha:(.mergeCommit.oid // null)
              }]' > finalization-prs.json
          bun --eval '
            import { createHash } from "node:crypto";
            import { writeFileSync } from "node:fs";
            const listing = Bun.spawnSync([
              "git", "ls-tree", "-r", "--name-only", "origin/next", "docs/content/changelog",
            ]);
            if (listing.exitCode !== 0) throw new Error("Unable to list public changelogs");
            const paths = new TextDecoder().decode(listing.stdout)
              .trim().split("\n").filter(path => path.endsWith(".mdx"));
            const inventory = paths.map(path => {
              const shown = Bun.spawnSync(["git", "show", `origin/next:${path}`]);
              if (shown.exitCode !== 0) throw new Error(`Unable to read ${path}`);
              return {
                path,
                sha256:createHash("sha256").update(shown.stdout).digest("hex"),
              };
            });
            writeFileSync("public-inventory.json", JSON.stringify(inventory, null, 2) + "\n");
          '
          draft=$(jq -r .changelog.draft_path evidence/manifest.json)
          bun .github/scripts/sdk-release/finalize-changelog.ts plan \
            --manifest evidence/manifest.json \
            --receipt evidence/attempt.json \
            --draft "$draft" \
            --inventory public-inventory.json \
            --pull-requests finalization-prs.json \
            --output finalization-plan.json
          echo "state=$(jq -r .state finalization-plan.json)" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r .final_path finalization-plan.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch finalization-plan.json)" >> "$GITHUB_OUTPUT"
          echo "pull_request=$(jq -r '.pull_request // \"\"' finalization-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Create or update stable finalization PR
        if: ${{ steps.plan.outputs.state != 'already_finalized' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FINAL_PATH: ${{ steps.plan.outputs.path }}
          FINAL_BRANCH: ${{ steps.plan.outputs.branch }}
          FINALIZATION_PR: ${{ steps.plan.outputs.pull_request }}
          MANIFEST_ID: ${{ needs.resolve-sealed-release.outputs.manifest_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          draft=$(jq -r .changelog.draft_path evidence/manifest.json)
          cp "$draft" /tmp/sdk-release-reviewed-changelog.mdx
          expected_remote=$(git ls-remote --heads origin "refs/heads/$FINAL_BRANCH" | cut -f1)
          git checkout -B "$FINAL_BRANCH" origin/next
          mkdir -p "$(dirname "$FINAL_PATH")"
          cp /tmp/sdk-release-reviewed-changelog.mdx "$FINAL_PATH"
          actual=$(shasum -a 256 "$FINAL_PATH" | cut -d' ' -f1)
          sealed=$(jq -r .changelog.sha256 evidence/manifest.json)
          test "$actual" = "$sealed"
          git config user.name "composio-release[bot]"
          git config user.email "composio-release[bot]@users.noreply.github.com"
          git add "$FINAL_PATH"
          git commit -m "docs(changelog): finalize SDK release $RELEASE_ID"
          git push origin \
            --force-with-lease="refs/heads/$FINAL_BRANCH:$expected_remote" \
            "HEAD:refs/heads/$FINAL_BRANCH"

          marker="<!-- sdk-release-finalization:$MANIFEST_ID -->"
          {
            echo "$marker"
            echo
            echo "## Verified SDK changelog finalization"
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Manifest: \`$MANIFEST_ID\`"
            echo "- Public path: \`$FINAL_PATH\`"
            echo "- Reviewed SHA-256: \`$sealed\`"
            echo
            echo "This PR copies the exact reviewed draft after registry verification. Docs checks must pass before merge."
          } > finalization-body.md
          if [[ -z "$FINALIZATION_PR" ]]; then
            FINALIZATION_PR=$(gh pr create \
              --base next \
              --head "$FINAL_BRANCH" \
              --title "docs(changelog): finalize SDK release $RELEASE_ID" \
              --body-file finalization-body.md)
          else
            gh pr edit "$FINALIZATION_PR" \
              --title "docs(changelog): finalize SDK release $RELEASE_ID" \
              --body-file finalization-body.md
          fi
          pr_number=${FINALIZATION_PR##*/}
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}
          auto_merge=$(gh api graphql \
            -f query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){autoMergeAllowed}}' \
            -F owner="$owner" \
            -F repo="$repo" \
            --jq .data.repository.autoMergeAllowed)
          if [[ "$auto_merge" == "true" ]]; then
            gh pr merge "$pr_number" --auto --squash
          else
            echo "Repository auto-merge is disabled; PR #$pr_number remains the explicit finalization step."
          fi

      - name: Finalization summary
        run: |
          {
            echo "## SDK changelog finalization"
            echo
            echo "- State: \`${{ steps.plan.outputs.state }}\`"
            echo "- Public path: \`${{ steps.plan.outputs.path }}\`"
            echo "- Manifest: \`${{ needs.resolve-sealed-release.outputs.manifest_id }}\`"
            echo
            echo "Package verification remains durable even if this recoverable finalization step fails."
          } >> "$GITHUB_STEP_SUMMARY"
