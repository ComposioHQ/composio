name: CLI Windows x64

on:
  pull_request:
    paths:
      - 'ts/packages/cli/**'
      - 'ts/packages/cli-keyring/**'
      - 'ts/packages/core/**'
      - 'ts/packages/ts-builders/**'
      - 'ts/packages/json-schema-to-effect-schema/**'
      - '.github/actions/setup-node-pnpm-bun/action.yml'
      - '.github/scripts/cli-release/**'
      - '.github/workflows/cli.windows.yml'
      - '.github/workflows/build-cli-binaries.yml'
      - 'install.ps1'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
  workflow_call:
    inputs:
      release_tag:
        description: 'Exact CLI release tag to embed and verify'
        type: string
        required: false
        default: '@composio/cli@0.0.0-beta.0'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || '@composio/cli@0.0.0-beta.0' }}
  TURBO_TELEMETRY_DEBUG: 1

jobs:
  build:
    name: Build Windows archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          cache-save: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build:packages

      - name: Cross-compile Windows x64
        working-directory: ts/packages/cli
        env:
          COMPOSIO_POSTHOG_PROJECT_API_KEY: ${{ vars.COMPOSIO_POSTHOG_PROJECT_API_KEY }}
        run: pnpm build:binary:cross --target bun-windows-x64

      - name: Package Windows archive
        working-directory: ts/packages/cli
        run: pnpm build:binary:package

      - name: Verify release metadata and companion layout
        env:
          ARCHIVE: ts/packages/cli/dist/binaries/composio-windows-x64.zip
          ARTIFACT: composio-windows-x64
        run: |
          unzip -p "$ARCHIVE" "$ARTIFACT/release-tag.txt" | grep -Fx "$RELEASE_TAG"
          bash .github/scripts/cli-release/verify-archive-companions.sh

      - name: Upload Windows archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composio-windows-x64
          path: ts/packages/cli/dist/binaries/composio-windows-x64.zip
          retention-days: 7

  test:
    name: Native Windows installation and runtime
    needs: build
    # Standard GitHub-hosted Windows runners are free for public repositories.
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # The shared mise bootstrap supports Linux and macOS. Use the same locked Bun asset here.
      - name: Set up locked Windows Bun for smoke tests
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath mise.lock -Raw
          if ($lock -notmatch '(?m)^\[tools\.bun\."platforms\.windows-x64"\]\r?\nchecksum = "sha512:([0-9a-f]{128})"\r?\nurl = "([^"]+)"') {
            throw 'Missing the Windows x64 Bun URL or checksum in mise.lock.'
          }
          $checksum, $url = $Matches[1], $Matches[2]
          $bunDir = Join-Path $env:RUNNER_TEMP 'locked-bun'
          New-Item -ItemType Directory -Path $bunDir | Out-Null
          $archive = Join-Path $bunDir 'bun.tgz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash -ne $checksum) { throw 'Bun archive checksum mismatch.' }
          tar.exe -xzf $archive -C $bunDir package/bin/bun.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract bun.exe.' }
          Join-Path $bunDir 'package/bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Download Windows archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: composio-windows-x64
          path: windows-artifact

      - name: Test installer, native binary, companions, and upgrades
        shell: pwsh
        run: |
          $expectedVersion = $env:RELEASE_TAG -replace '^@composio/cli@', ''
          ./.github/scripts/cli-release/test-windows.ps1 -ArchivePath ./windows-artifact/composio-windows-x64.zip -ExpectedVersion $expectedVersion
