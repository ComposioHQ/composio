name: Build Typescript SDK

on:
  push:
    branches: [master]
    paths:
      - 'ts/**'
      - '.github/actions/setup-node-pnpm-bun/action.yml'
      - '.github/workflows/ts.build.yml'
      - 'mise.toml'
      - 'mise.lock'
  pull_request:
    paths:
      - 'ts/**'
      - '.github/actions/setup-node-pnpm-bun/action.yml'
      - '.github/workflows/ts.build.yml'
      - 'mise.toml'
      - 'mise.lock'

# Print Turborepo telemetry events to the logs instead of sending them.
env:
  TURBO_TELEMETRY_DEBUG: 1

jobs:
  build:
    name: Build Typescript SDK (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.3', '24.17.0']

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm lint

      - name: Run Build
        run: pnpm run build:packages
