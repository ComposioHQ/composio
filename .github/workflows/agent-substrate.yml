name: Agent Substrate

# Guards the repo-level AI-agent guidance — the files coding agents read —
# so it cannot silently drift from reality:
#
#   * `bun run validate:agent-skills`  — SKILL.md frontmatter and reference links,
#     the .agents/skills <-> .claude/skills compatibility symlink, required
#     nested AGENTS.md files, stale guidance references, and every pnpm/make/
#     nox command mentioned in guidance checked against its real definition.
#   * `bun run validate:skill-routing` — deterministic routing smoke test: each
#     skill keeps a probe asserting it is the unique top match for a
#     representative task, so description edits cannot silently break routing.
#
# `validate:cli-skills` checks repo-linked examples and exercises the selected
# CLI invocation contracts, including native Effect client requests.
#
# These guidance checks run nowhere else, so this workflow is their only enforcement
# point. It runs on every push and PR with no path filters: the
# validate:agent-skills stale-guidance walk scans every text file in the
# repo, so any change can affect the result. Both scripts are
# Bun TypeScript programs using the repository's existing dependencies.

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  antislop:
    name: Anti-slop (TypeScript, Python, YAML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test anti-slop rules and enforcement
        run: pnpm test:antislop

      - name: Typecheck Effect lint rules
        run: pnpm typecheck:effect-rules

      - name: Reject new anti-slop findings
        run: pnpm lint:antislop

  validate:
    name: Validate agent guidance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          # Only push runs on next save caches: PR-scoped caches are invisible
          # to other branches, so saving them costs post-job time and evicts
          # reusable default-branch caches from the 10 GB repo quota.
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate agent skills and guidance invariants
        run: bun run validate:agent-skills

      - name: Validate skill routing
        run: bun run validate:skill-routing

      - name: Decide whether CLI skill certification needs full CLI checks
        id: cli-skills-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inputs=(
            'ts/packages/cli/**'
            'ts/packages/cli-keyring/**'
            'ts/packages/json-schema-to-effect-schema/**'
            'ts/scripts/check-cli-skills.ts'
            'test/cli-skills.test.ts'
            '.agents/skills/cli-command/**'
            '.agents/skills/effect-v4/**'
            '.agents/skills/typescript-testing/**'
            '.github/workflows/agent-substrate.yml'
            '.github/actions/setup-node-pnpm-bun/action.yml'
            'package.json'
            'pnpm-lock.yaml'
            'pnpm-workspace.yaml'
            'patches/**'
            'mise.toml'
            'mise.lock'
            'turbo.jsonc'
          )
          if [[ -z "$PR_BASE_SHA" ]] || ! git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$PR_BASE_SHA" HEAD -- "${inputs[@]/#/:(glob)}"; then
            echo "No CLI or CLI-skill input changed; running excerpts-only check."
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Certify CLI skill examples and invocation contracts
        env:
          FULL_CLI_CHECKS: ${{ steps.cli-skills-scope.outputs.full }}
        run: |
          if [[ "$FULL_CLI_CHECKS" == "true" ]]; then
            bun run validate:cli-skills
          else
            bun test test/cli-skills.test.ts && bun ts/scripts/check-cli-skills.ts --excerpts-only
          fi

      - name: Typecheck agent tooling
        run: bun run typecheck:agent-workflow

      - name: Verify resumable task and evidence contracts
        run: bun run test:agent-workflow

      - name: Verify issue triage security boundary
        run: pnpm test:issue-triage

      - name: Verify API client dependency reconciliation
        run: bun test test/composio-client-update.test.ts
