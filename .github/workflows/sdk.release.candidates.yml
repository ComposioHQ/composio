name: SDK release candidates
run-name: SDK release candidates (${{ github.head_ref }})

# Builds and checks the package files a release PR will publish. This workflow only runs on
# pull_request, with a read-only token, no secrets and no caches. The privileged SDK release
# workflow never checks out PR code; after approval and merge, its tag run publishes these exact
# artifacts.
on:
  pull_request:
    branches: [next]
    paths: ['.github/sdk-release-plan.json', 'scripts/sdk-release/**']

permissions:
  contents: read
  actions: read

jobs:
  select-candidates:
    if: >-
      github.repository == 'ComposioHQ/composio' &&
      startsWith(github.event.pull_request.head.ref, 'sdk-release/batch-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.select.outputs.languages }}
      channel: ${{ steps.select.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select planned language lanes
        id: select
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const batch = JSON.parse(readFileSync('.github/sdk-release-plan.json', 'utf8'));
          const languages = [...new Set(batch.plan.releases.map(release => release.language))];
          // Languages reach shell steps through the matrix, so accept only known values.
          if (!languages.every(language => ['typescript', 'python'].includes(language))) throw new Error('Unknown release language');
          const channel = batch.plan.choices.channel ?? 'stable';
          if (!['stable', 'beta'].includes(channel)) throw new Error('Unknown release channel');
          appendFileSync(process.env.GITHUB_OUTPUT, `languages=${JSON.stringify(languages)}\nchannel=${channel}\n`);
          JS

  candidate:
    # The release merge requires this check name to pass on the approved head.
    name: SDK candidate (${{ matrix.language }})
    needs: select-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.select-candidates.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-caching: 'false'
      - uses: ./.github/actions/setup-python-uv
        with:
          enable-caching: 'false'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and check the candidate
        env:
          SDK_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          LANGUAGE: ${{ matrix.language }}
        run: bun scripts/sdk-release/candidates.ts "$LANGUAGE"
      - name: Retain candidate bytes for publication
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-candidate-${{ matrix.language }}
          path: sdk-candidate/${{ matrix.language }}/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Report candidate identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SDK_READ_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
        run: bun scripts/sdk-release/candidates.ts report "$LANGUAGE"

  # Installs third-party packages from the registries, so it runs apart from the build job and
  # has no upload step. Code it runs still holds this run's runtime token, so the tag run refuses
  # any candidate artifact created after the build job finished.
  smoke:
    # The release merge requires this check name to pass on the approved head.
    name: SDK candidate smoke (${{ matrix.language }})
    needs: [select-candidates, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.select-candidates.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-caching: 'false'
      - uses: ./.github/actions/setup-python-uv
        with:
          enable-caching: 'false'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-candidate-${{ matrix.language }}
          path: sdk-candidate/${{ matrix.language }}
      - name: Install and import the candidate like a user
        env:
          LANGUAGE: ${{ matrix.language }}
        run: bun scripts/sdk-release/consumers.ts "sdk-candidate/$LANGUAGE"

  # Type-checks and builds the docs against the packages this release publishes, not the published
  # ones the pull-request docs workflows install. Like the smoke job it runs third-party code with
  # this run's runtime token, so it has no upload step and no credentials.
  docs:
    # The release merge requires this check name to pass on the approved head of a stable release.
    name: SDK candidate docs
    needs: [select-candidates, candidate]
    # Runs even when the Python candidate fails, so its result still reaches the reviewers.
    if: ${{ !cancelled() && needs.select-candidates.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-caching: 'false'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: contains(fromJSON(needs.select-candidates.outputs.languages), 'typescript')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-candidate-typescript
          path: sdk-candidate/typescript
      - name: Install the docs against the candidate packages
        run: bun scripts/sdk-release/candidate-registry.ts sdk-candidate/typescript
      - name: Lint TypeScript
        working-directory: docs
        run: bun run lint
      - name: TypeScript type check
        working-directory: docs
        run: bun run types:check
      - name: Check TypeScript snippet and KB language-option regressions
        working-directory: docs
        run: bun test tests/static/typescript-snippets.test.ts tests/static/kb-generation.test.ts
      - name: Check authored TypeScript outside Twoslash build coverage
        working-directory: docs
        run: bun run check:typescript-snippets
      - name: Build (validates Twoslash TypeScript code blocks)
        working-directory: docs
        run: bun run build
