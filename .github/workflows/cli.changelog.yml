name: Update CLI Changelog

on:
  # The job uses only protected next code and published tag contents as data.
  # It does not download artifacts or use caches from the triggering workflow.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Build CLI Binaries]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-changelog
  cancel-in-progress: false

jobs:
  changelog:
    # This runs on the protected default branch with the SDK release App's
    # environment. Read published tags as data and execute only code from next.
    if: >-
      github.repository == 'ComposioHQ/composio' && github.ref == 'refs/heads/next' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         startsWith(github.event.workflow_run.head_branch, '@composio/cli@')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
        with:
          enable-caching: 'false'
      - run: bun test ./.github/scripts/cli-release/update-changelog.test.ts
      - name: Update the changelog from published stable tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
          mapfile -t tags <<< "$published"
          bun .github/scripts/cli-release/update-changelog.ts "${tags[@]}"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: ComposioHQ
          repositories: composio
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the changelog PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          base: next
          branch: chore/cli-release-changelog
          delete-branch: true
          commit-message: 'docs(cli): update the stable changelog'
          title: 'docs(cli): update the stable changelog'
          body: |
            Move the notes included in published stable binaries into their version sections.
            Notes added after those releases stay under Unreleased.

            [Changelog workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          add-paths: ts/packages/cli/CHANGELOG.md
