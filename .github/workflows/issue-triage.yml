name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage (omit to retry open support: forward failed issues)"
        required: false
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - name: Check triage eligibility
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { eventName, payload, actor, repo } = context;
            if (eventName === "issues" && payload.action === "opened") {
              core.setOutput("allowed", "true");
              return;
            }
            if (eventName === "issue_comment") {
              const issue = payload.issue;
              const labels = (issue?.labels || []).map(l => (typeof l === "string" ? l : l.name));
              const ok = payload.action === "created" && !issue?.pull_request && issue?.user?.login === actor && labels.includes("support: redirected");
              core.setOutput("allowed", String(ok));
              return;
            }
            if (eventName === "issues" && payload.action === "labeled" && !["triage", "support", "support: forwarded"].includes(payload.label?.name)) {
              core.setOutput("allowed", "false");
              return;
            }
            let allowed = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner: repo.owner, repo: repo.repo, username: actor });
              allowed = ["admin", "maintain", "write"].includes(data.permission);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput("allowed", String(allowed));

  classify:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: issue-triage
    permissions:
      issues: read
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      answers: ${{ steps.classify.outputs.answers }}
      issue_number: ${{ steps.classify.outputs.issue_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Classify issue with Jev
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
        with:
          script: |
            const [{ pathToFileURL }, { resolve }] = await Promise.all([import("node:url"), import("node:path")]);
            const load = p => import(pathToFileURL(resolve(p)).href);
            const { needsClassification, parseEvent } = await load(".github/scripts/issue-triage/route.ts");
            const { classifyWithJev } = await load(".github/scripts/issue-triage/jev.ts");
            const raw = (process.env.ISSUE_NUMBER || "").trim();
            if (context.eventName === "workflow_dispatch" && !raw) {
              core.setOutput("mode", "sweep");
              core.setOutput("issue_number", "");
              return;
            }
            const issue_number = Number(raw);
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) throw new Error("Invalid issue_number");
            const { data: issue } = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            if (issue.pull_request) throw new Error("Cannot triage a pull request as an issue");
            const event = parseEvent(context.eventName, context.payload);
            if (issue.state === "closed" && event.type !== "author-comment") return;
            const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name));
            core.setOutput("issue_number", String(issue_number));
            if (!needsClassification(event, labels)) {
              core.setOutput("mode", "none");
              return;
            }
            try {
              const answers = await classifyWithJev({ title: issue.title || "", body: issue.body || "" }, { apiKey: process.env.TYPESAFE_API_KEY || "" });
              core.setOutput("mode", "answers");
              core.setOutput("answers", JSON.stringify(answers));
            } catch (error) {
              core.warning(`Classification failed: ${error instanceof Error ? error.message : String(error)}`);
              core.setOutput("mode", "failed");
            }

  apply:
    needs: classify
    if: needs.classify.outputs.mode != ''
    concurrency:
      group: issue-triage-${{ needs.classify.outputs.mode == 'sweep' && 'sweep' || needs.classify.outputs.issue_number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply triage actions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          ANSWERS: ${{ needs.classify.outputs.answers }}
          ISSUE_NUMBER: ${{ needs.classify.outputs.issue_number }}
          PLAIN_API_KEY: ${{ secrets.PLAIN_API_KEY }}
        with:
          script: |
            const [{ pathToFileURL }, { resolve }] = await Promise.all([import("node:url"), import("node:path")]);
            const load = p => import(pathToFileURL(resolve(p)).href);
            const { LABEL_METADATA, SUPPORT_STATE_LABELS, parseEvent, route } = await load(".github/scripts/issue-triage/route.ts");
            const { forwardIssueToPlain } = await load(".github/scripts/issue-triage/plain.ts");
            const { owner, repo } = context.repo;
            const plainApiKey = process.env.PLAIN_API_KEY || "";

            async function ensureLabel(name) {
              const meta = LABEL_METADATA[name];
              if (!meta) return;
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { if (e.status !== 404) throw e; await github.rest.issues.createLabel({ owner, repo, name, ...meta }); }
            }
            async function removeLabel(issue_number, name) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(e => { if (e.status !== 404) throw e; });
            }
            async function forwardOne(issue) {
              const login = issue.user?.login || "unknown";
              let email = issue.user?.email || null;
              let name = issue.user?.name || login;
              if (login !== "unknown") {
                try {
                  const { data: u } = await github.rest.users.getByUsername({ username: login });
                  email = u.email || email;
                  name = u.name || name;
                } catch {}
              }
              return forwardIssueToPlain(
                { owner, repo, number: issue.number, title: issue.title || "", body: issue.body || "", htmlUrl: issue.html_url, author: { login, id: issue.user?.id, email, name } },
                { apiKey: plainApiKey }
              );
            }

            const mode = process.env.MODE;
            if (mode === "sweep") {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: "support: forward failed" });
              let failed = 0;
              for (const issue of issues) {
                if (issue.pull_request) continue;
                try {
                  await forwardOne(issue);
                  await ensureLabel("support: forwarded");
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["support: forwarded"] });
                  await removeLabel(issue.number, "support: forward failed");
                  await removeLabel(issue.number, "triage");
                } catch (e) { failed++; core.warning(`Retry failed for #${issue.number}: ${e instanceof Error ? e.message : String(e)}`); }
              }
              if (failed > 0) core.setFailed(`Plain retry failed for ${failed} issue(s).`);
              return;
            }

            const issue_number = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name));
            const input = mode === "answers" ? { kind: "answers", answers: JSON.parse(process.env.ANSWERS || "{}") } : { kind: mode === "failed" ? "failed" : "none" };
            const actions = route(parseEvent(context.eventName, context.payload), { labels, state: issue.state, closedByWorkflow: issue.closed_by?.login === "github-actions[bot]" }, input);

            let forwardError = null;
            if (actions.some(a => a.type === "reopen")) await github.rest.issues.update({ owner, repo, issue_number, state: "open" });
            if (actions.some(a => a.type === "forward")) {
              try { await forwardOne(issue); }
              catch (e) { forwardError = e instanceof Error ? e.message : String(e); }
            }
            const toAdd = [];
            const toRemove = [];
            for (const a of actions) {
              if (a.type === "add-label") {
                const label = forwardError && a.label === "support: forwarded" ? "support: forward failed" : a.label;
                if (!toAdd.includes(label)) toAdd.push(label);
              } else if (a.type === "remove-label" && !(forwardError && (a.label === "triage" || a.label === "support: forward failed"))) {
                toRemove.push(a.label);
              } else if (a.type === "add-assignees") await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [...a.assignees] });
              else if (a.type === "comment") await github.rest.issues.createComment({ owner, repo, issue_number, body: a.body });
              else if (a.type === "close") await github.rest.issues.update({ owner, repo, issue_number, state: "closed", state_reason: a.reason });
            }
            if (forwardError) {
              if (!toAdd.includes("support: forward failed") && !labels.includes("support: forward failed")) toAdd.push("support: forward failed");
              for (const l of labels) if (SUPPORT_STATE_LABELS.includes(l) && l !== "support: forward failed" && !toRemove.includes(l)) toRemove.push(l);
            }
            for (const l of toAdd) await ensureLabel(l);
            if (toAdd.length > 0) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            for (const l of toRemove) await removeLabel(issue_number, l);
            if (forwardError) core.setFailed(`Plain forwarding failed: ${forwardError}`);
            else if (mode === "failed") core.setFailed("Classification failed; added triage label for retry.");
