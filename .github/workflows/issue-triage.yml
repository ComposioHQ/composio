name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage (omit to retry open support: forward failed issues)"
        required: false
        type: string

permissions: {}

# Every job runs the trusted scripts from next, never from the event's ref.
jobs:
  authorize:
    # Skip events the script would deny before installing anything: comments are admitted only on
    # redirected issues, and labels only when they request triage. The script enforces the full rule.
    if: >-
      (github.event_name != 'issue_comment' ||
      contains(github.event.issue.labels.*.name, 'support: redirected')) &&
      (github.event.action != 'labeled' ||
      contains(fromJSON('["triage","support","support: forwarded"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check triage eligibility
        id: authorize
        run: bun scripts/issue-triage/main.ts authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}

  classify:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: issue-triage
    permissions:
      issues: read
      contents: read
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      batches: ${{ steps.classify.outputs.batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Classify issue with Jev
        id: classify
        run: bun scripts/issue-triage/main.ts classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  apply:
    needs: classify
    if: needs.classify.outputs.classification != ''
    # Every event for an issue uses the same group. Batching keeps a sweep within GitHub's matrix limit.
    # A failing batch must not cancel other groups.
    strategy:
      fail-fast: false
      matrix:
        # The fallback only keeps the matrix parseable when the job is skipped by `if`.
        batch: ${{ fromJSON(needs.classify.outputs.batches || '[{"group":0,"numbers":[]}]') }}
    concurrency:
      group: issue-triage-apply-${{ matrix.batch.group }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.classify.outputs.classification || '{}').kind == 'sweep' && 120 || 5 }}
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm-bun
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply triage actions
        run: bun scripts/issue-triage/main.ts apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLASSIFICATION: ${{ needs.classify.outputs.classification }}
          ISSUE_NUMBERS: ${{ toJSON(matrix.batch.numbers) }}
          PLAIN_API_KEY: ${{ secrets.PLAIN_API_KEY }}
