name: Issue Triage

on:
  issues:
    types: [opened, reopened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage (omit to retry open support: forward failed issues)"
        required: false
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - name: Check triage eligibility
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { eventName, payload, actor, repo } = context;
            if (eventName === "issues" && payload.action === "opened") {
              core.setOutput("allowed", "true");
              return;
            }
            if (eventName === "issue_comment") {
              const issue = payload.issue;
              const labels = (issue?.labels || []).map(l => (typeof l === "string" ? l : l.name));
              const ok = payload.action === "created" && !issue?.pull_request && issue?.user?.login === actor && labels.includes("support: redirected");
              core.setOutput("allowed", String(ok));
              return;
            }
            if (eventName === "issues" && payload.action === "labeled" && !["triage", "support", "support: forwarded"].includes(payload.label?.name)) {
              core.setOutput("allowed", "false");
              return;
            }
            let allowed = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner: repo.owner, repo: repo.repo, username: actor });
              allowed = ["admin", "maintain", "write"].includes(data.permission);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput("allowed", String(allowed));

  classify:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: issue-triage
    permissions:
      issues: read
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      answers: ${{ steps.classify.outputs.answers }}
      batches: ${{ steps.classify.outputs.batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Classify issue with Jev
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
        with:
          script: |
            const [{ pathToFileURL }, { resolve }] = await Promise.all([import("node:url"), import("node:path")]);
            const load = p => import(pathToFileURL(resolve(p)).href);
            const { needsClassification, parseEvent } = await load(".github/scripts/issue-triage/route.ts");
            const { classifyWithJev } = await load(".github/scripts/issue-triage/jev.ts");
            function setBatches(numbers) {
              const batches = new Map();
              for (const number of numbers) {
                const group = number % 64;
                if (!batches.has(group)) batches.set(group, []);
                batches.get(group).push(number);
              }
              core.setOutput("batches", JSON.stringify([...batches].map(([group, numbers]) => ({ group, numbers }))));
            }

            const raw = (process.env.ISSUE_NUMBER || "").trim();
            if (context.eventName === "workflow_dispatch" && !raw) {
              const listed = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "support: forward failed", per_page: 100 });
              const numbers = listed.filter(i => !i.pull_request).map(i => i.number);
              if (numbers.length === 0) return;
              core.setOutput("mode", "sweep");
              setBatches(numbers);
              return;
            }
            const issue_number = Number(raw);
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) throw new Error("Invalid issue_number");
            const { data: issue } = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            if (issue.pull_request) throw new Error("Cannot triage a pull request as an issue");
            const event = parseEvent(context.eventName, context.payload);
            if (issue.state === "closed" && event.type !== "author-comment") return;
            const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name));
            setBatches([issue_number]);
            if (!needsClassification(event, labels)) {
              core.setOutput("mode", "none");
              return;
            }
            try {
              const answers = await classifyWithJev({ title: issue.title || "", body: issue.body || "" }, { apiKey: process.env.TYPESAFE_API_KEY || "" });
              core.setOutput("mode", "answers");
              core.setOutput("answers", JSON.stringify(answers));
            } catch (error) {
              core.warning(`Classification failed: ${error instanceof Error ? error.message : String(error)}`);
              core.setOutput("mode", "failed");
            }

  apply:
    needs: classify
    if: needs.classify.outputs.mode != ''
    # Every event for an issue uses the same group. Batching keeps a sweep within GitHub's matrix limit.
    # A failing batch must not cancel other groups.
    strategy:
      fail-fast: false
      matrix:
        # The fallback only keeps the matrix parseable when the job is skipped by `if`.
        batch: ${{ fromJSON(needs.classify.outputs.batches || '[{"group":0,"numbers":[]}]') }}
    concurrency:
      group: issue-triage-apply-${{ matrix.batch.group }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.classify.outputs.mode == 'sweep' && 120 || 5 }}
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          sparse-checkout: .github/scripts/issue-triage
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply triage actions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          ANSWERS: ${{ needs.classify.outputs.answers }}
          ISSUE_NUMBERS: ${{ toJSON(matrix.batch.numbers) }}
          PLAIN_API_KEY: ${{ secrets.PLAIN_API_KEY }}
        with:
          script: |
            const [{ pathToFileURL }, { resolve }] = await Promise.all([import("node:url"), import("node:path")]);
            const load = p => import(pathToFileURL(resolve(p)).href);
            const { LABEL_METADATA, REDIRECT_COMMENT, REDIRECT_MARKER, REDIRECT_PENDING, SUPPORT_STATE_LABELS, parseEvent, route } = await load(".github/scripts/issue-triage/route.ts");
            const { forwardIssueToPlain } = await load(".github/scripts/issue-triage/plain.ts");
            const { owner, repo } = context.repo;
            const FAILED = "support: forward failed";
            const mode = process.env.MODE;
            const issueNumbers = JSON.parse(process.env.ISSUE_NUMBERS || "[]");
            if (!Array.isArray(issueNumbers) || issueNumbers.length === 0 ||
                issueNumbers.some(number => !Number.isSafeInteger(number) || number <= 0)) {
              throw new Error("Invalid apply issue numbers");
            }

            async function applyIssue(issue_number) {
              async function ensureLabel(name) {
                const meta = LABEL_METADATA[name];
                if (!meta) return;
                try { await github.rest.issues.getLabel({ owner, repo, name }); }
                catch (e) {
                  if (e.status !== 404) throw e;
                  // Another issue's run may create the same label first; "already exists" is success.
                  try { await github.rest.issues.createLabel({ owner, repo, name, ...meta }); }
                  catch (e2) { if (!(e2.status === 422 && (e2.response?.data?.errors || []).some(x => x.code === "already_exists"))) throw e2; }
                }
              }
              async function addLabels(names) {
                const labels = [...new Set(names)];
                if (labels.length === 0) return;
                for (const l of labels) await ensureLabel(l);
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
              }
              async function removeLabel(name) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(e => { if (e.status !== 404) throw e; });
              }

              // Re-fetch under the per-issue lock; everything below decides from this fresh state.
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request) return;
              const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name));
              if (mode === "sweep" && (issue.state !== "open" || !labels.includes(FAILED))) {
                core.info(`Skipping #${issue_number}: no longer an open issue awaiting a Plain retry.`);
                return;
              }
              const input = mode === "answers" ? { kind: "answers", answers: JSON.parse(process.env.ANSWERS || "{}") } : { kind: mode === "failed" ? "failed" : "none" };
              const actions = route(parseEvent(context.eventName, context.payload), { labels, state: issue.state, closedByWorkflow: issue.closed_by?.login === "github-actions[bot]" }, input);
              const has = type => actions.some(a => a.type === type);
              const adds = [...new Set(actions.filter(a => a.type === "add-label").map(a => a.label))];
              const removes = [...new Set(actions.filter(a => a.type === "remove-label").map(a => a.label))];
              const closeIssue = a => github.rest.issues.update({ owner, repo, issue_number, state: "closed", state_reason: a.reason });

              if (actions.some(a => a.type === "comment" && a.body === REDIRECT_COMMENT)) {
                // Save the recovery label and pending state before publishing the reply instructions.
                await addLabels(labels.includes(REDIRECT_PENDING) ? adds : [...adds, REDIRECT_PENDING]);
                for (const l of removes) if (l !== "triage") await removeLabel(l);
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                if (!comments.some(c => c.user?.login === "github-actions[bot]" && String(c.body || "").includes(REDIRECT_MARKER))) {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: REDIRECT_COMMENT });
                }
                await closeIssue(actions.find(a => a.type === "close") || {});
                await removeLabel(REDIRECT_PENDING);
                if (removes.includes("triage")) await removeLabel("triage");
                return;
              }

              let forwardError = null;
              const forwarding = has("forward");
              if (forwarding) {
                // Fail-safe marker first: any later failure (reopen, Plain, label writes) leaves an issue the sweep, a
                // numbered dispatch, or the reporter's next reply can resume. Plain thread lookup keeps retries idempotent.
                await addLabels(["support", FAILED].filter(l => !labels.includes(l)));
              }
              if (has("reopen")) await github.rest.issues.update({ owner, repo, issue_number, state: "open" });
              if (forwarding) {
                try {
                  await forwardIssueToPlain(
                    { owner, repo, number: issue.number, title: issue.title || "", body: issue.body || "", htmlUrl: issue.html_url, author: { login: issue.user?.login || "unknown", id: issue.user?.id } },
                    { apiKey: process.env.PLAIN_API_KEY || "" }
                  );
                } catch (e) { forwardError = e instanceof Error ? e.message : String(e); }
              }

              let finalAdds = adds;
              let finalRemoves = removes;
              if (forwardError) {
                finalAdds = adds.filter(l => l !== "support: forwarded");
                finalRemoves = labels.filter(l => SUPPORT_STATE_LABELS.includes(l) && l !== FAILED);
              }
              if (forwarding && labels.includes(REDIRECT_PENDING)) finalRemoves = [...finalRemoves, REDIRECT_PENDING];
              await addLabels(finalAdds);
              for (const label of finalRemoves) {
                if (label !== "triage" && label !== FAILED) await removeLabel(label);
              }
              for (const a of actions) {
                if (a.type === "add-assignees") await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [...a.assignees] });
                else if (a.type === "comment") await github.rest.issues.createComment({ owner, repo, issue_number, body: a.body });
                else if (a.type === "close") await closeIssue(a);
              }
              if (finalRemoves.includes("triage")) await removeLabel("triage");
              if (forwarding && !forwardError) await removeLabel(FAILED);
              if (forwardError) core.setFailed(`Plain forwarding failed: ${forwardError}`);
              else if (mode === "failed") core.setFailed("Classification failed; added triage label for retry.");
            }

            for (const number of issueNumbers) {
              try {
                await applyIssue(number);
              } catch (error) {
                if (mode !== "sweep") throw error;
                core.setFailed(`Retry failed for #${number}: ${error instanceof Error ? error.message : String(error)}`);
              }
            }
