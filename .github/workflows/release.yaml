name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-core:
    name: Create composio-core release
    defaults:
      run:
        working-directory: ./python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Assert release tag matches package version
        if: github.event_name == 'release'
        run: |
          package_version=$(python -c 'import runpy; print(runpy.run_path("composio/__version__.py")["__version__"])')
          if [ "$GITHUB_REF" != "refs/tags/v$package_version" ]; then
            echo "Release tag $GITHUB_REF does not match package version v$package_version"
            exit 1
          fi
      - name: Build and verify
        run: |
          python -m pip install --upgrade pip
          pip install twine build
          python -m build
          twine check dist/*
          python - <<'PY'
          from email import policy
          from email.parser import Parser
          from pathlib import Path
          import runpy
          import tarfile
          from zipfile import ZipFile

          def parse_metadata(raw: bytes):
              return Parser(policy=policy.compat32).parsestr(raw.decode())

          expected_description = Path("README.md").read_text(encoding="utf-8")
          expected_version = runpy.run_path("composio/__version__.py")["__version__"]

          wheel = next(Path("dist").glob("composio_core-*.whl"))
          with ZipFile(wheel) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              wheel_metadata = parse_metadata(archive.read(metadata_path))

          sdist = next(Path("dist").glob("composio_core-*.tar.gz"))
          with tarfile.open(sdist, "r:gz") as archive:
              metadata_member = next(
                  member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")
              )
              metadata_file = archive.extractfile(metadata_member)
              assert metadata_file is not None, "sdist: PKG-INFO could not be read"
              sdist_metadata = parse_metadata(metadata_file.read())

          for kind, metadata in (("wheel", wheel_metadata), ("sdist", sdist_metadata)):
              assert metadata["Version"] == expected_version, (
                  f"{kind}: {metadata['Version']} != {expected_version}"
              )
              assert metadata.get_payload() == expected_description, (
                  f"{kind}: description does not match README.md"
              )
          PY
      - name: Publish composio-core to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
          packages-dir: python/dist/
          attestations: false
