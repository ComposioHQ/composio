name: Claude Code

# Claude runs only when a maintainer starts it from the Actions tab
# (or `gh workflow run claude.yml -f task="..."`). It is not triggered by
# issues, comments, or reviews: this repository is public, and those events
# let outside users put text in front of an agent that can run shell
# commands with repository write access (prompt injection).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should Claude do? Example: 'Fix the failing test in X and open a PR.'"
        required: true
        type: string

permissions: {}

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push Claude's own branch
      pull-requests: write # open a pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the job's GITHUB_TOKEN (scoped to the permissions above and
          # expiring with the job) instead of minting a GitHub App token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            ${{ inputs.task }}

            Always work on a new branch and open a pull request. Never push to `next`.

          # https://code.claude.com/docs/en/cli-reference#cli-flags
          # claude_args: |
          #   --model "claude-opus-4-20250514"
          #   --append-system-prompt "Follow our coding standards"
