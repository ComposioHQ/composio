name: Docs - SDK reference drift

# Regenerates both SDK references from the PR's sources and fails when the committed
# output differs, so generator changes and stale references surface here rather than in
# a release PR. It then type-checks the code blocks on both generated references against
# the workspace SDK sources (TypeScript and Python). next requires this check. Pushes to
# next run it too, so two green PRs that combine into broken reference code fail on next
# before anyone requests a release. It runs the generators against PR code, so it gets
# read-only contents access and no secrets.
on:
  push:
    branches: [next]
    paths:
      - 'ts/packages/core/src/**'
      - 'ts/packages/core/generated/**'
      - 'ts/packages/core/scripts/generate-docs.ts'
      - 'ts/packages/core/package.json'
      - 'ts/packages/core/tsconfig.json'
      - 'ts/packages/json-schema-to-zod/**'
      - 'scripts/docs-reference-check/**'
      - 'test/docs-reference-check.test.ts'
      - 'test/fixtures/docs-reference-check/**'
      - 'tsconfig.docs-reference-check.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'python/composio/**'
      - 'python/scripts/generate-docs.py'
      - 'python/pyproject.toml'
      - 'uv.lock'
      - 'docs/content/reference/sdk-reference/**'
      - 'docs/scripts/check-python-snippets.ts'
      - 'docs/scripts/python-snippets/**'
      - 'docs/lib/code-examples.ts'
      - 'docs/lib/example-document.ts'
      - 'docs/lib/llm-guardrails/**'
      - 'docs/package.json'
      - 'docs/bun.lock'
      - 'pyproject.toml'
      - '.github/actions/setup-node-pnpm-bun/action.yml'
      - '.github/actions/setup-python-uv/action.yml'
      - '.github/workflows/docs-sdk-reference-drift.yml'
      - 'mise.toml'
      - 'mise.lock'
  # No path filter: next requires this check, and a check a path filter skips never
  # reports, so the PR would wait on it forever. The scope step below skips the work instead.
  pull_request:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: SDK reference drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same inputs as the push path filter above; test/docs-reference-check.test.ts keeps
      # the two lists identical. A PR that touches none of them passes without the work.
      - name: Decide whether the change can affect the references
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          inputs=(
            'ts/packages/core/src/**'
            'ts/packages/core/generated/**'
            'ts/packages/core/scripts/generate-docs.ts'
            'ts/packages/core/package.json'
            'ts/packages/core/tsconfig.json'
            'ts/packages/json-schema-to-zod/**'
            'scripts/docs-reference-check/**'
            'test/docs-reference-check.test.ts'
            'test/fixtures/docs-reference-check/**'
            'tsconfig.docs-reference-check.json'
            'package.json'
            'pnpm-lock.yaml'
            'pnpm-workspace.yaml'
            'patches/**'
            'python/composio/**'
            'python/scripts/generate-docs.py'
            'python/pyproject.toml'
            'uv.lock'
            'docs/content/reference/sdk-reference/**'
            'docs/scripts/check-python-snippets.ts'
            'docs/scripts/python-snippets/**'
            'docs/lib/code-examples.ts'
            'docs/lib/example-document.ts'
            'docs/lib/llm-guardrails/**'
            'docs/package.json'
            'docs/bun.lock'
            'pyproject.toml'
            '.github/actions/setup-node-pnpm-bun/action.yml'
            '.github/actions/setup-python-uv/action.yml'
            '.github/workflows/docs-sdk-reference-drift.yml'
            'mise.toml'
            'mise.lock'
          )
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- "${inputs[@]/#/:(glob)}"; then
            echo "No SDK reference input changed; nothing to check."
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js, pnpm, Bun
        if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-node-pnpm-bun
        with:
          cache-save: 'false'

      - name: Setup Python and uv
        if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-python-uv
        with:
          enable-caching: 'false'

      - name: Install dependencies
        if: steps.scope.outputs.affected == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate the TypeScript reference
        if: steps.scope.outputs.affected == 'true'
        run: pnpm --filter @composio/core generate:docs

      - name: Regenerate the Python reference
        if: steps.scope.outputs.affected == 'true'
        working-directory: python
        run: uv run --frozen --only-group docs-reference python scripts/generate-docs.py

      - name: Check for drift
        if: steps.scope.outputs.affected == 'true'
        run: |
          changed=$(git status --porcelain --untracked-files=all -- docs/content/reference/sdk-reference)
          if [[ -n "$changed" ]]; then
            echo "::error::The committed SDK reference is out of date with its sources."
            echo "$changed"
            git diff --stat -- docs/content/reference/sdk-reference
            echo "Regenerate with: pnpm --filter @composio/core generate:docs && (cd python && uv run --frozen --only-group docs-reference python scripts/generate-docs.py)"
            exit 1
          fi

      - name: Test the TypeScript reference checker
        if: steps.scope.outputs.affected == 'true'
        run: |
          pnpm run typecheck:docs-reference-check
          pnpm run test:docs-reference-check

      - name: Type-check the TypeScript reference code blocks
        if: steps.scope.outputs.affected == 'true'
        run: pnpm run check:docs-reference

      - name: Install docs checker dependencies
        if: steps.scope.outputs.affected == 'true'
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the Python reference code blocks
        if: steps.scope.outputs.affected == 'true'
        working-directory: docs
        run: bun run check:python-snippets --reference
