name: CLI - Update Toolkit Slugs

# Keeps `ts/packages/cli/src/generated/toolkit-slugs.ts` in step with the
# production catalog. The CLI resolves a tool slug to its toolkit by matching
# against that list, and only pays for a network fetch when a slug is missing
# from it — so a stale list costs users a ~2 s fetch, never a wrong answer.

on:
  schedule:
    # Weekly, Monday morning UTC. New toolkits ship continuously; users of an
    # older binary fall back to the runtime fetch until their next upgrade.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-toolkit-slugs:
    name: Refresh baked toolkit slugs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # The baked list ships to users of the PRODUCTION catalog, and the
      # generator targets production unless COMPOSIO_BASE_URL says otherwise.
      # `docs-update-data.yml` documents this shared secret as staging-scoped
      # and uses `secrets.COMPOSIO_DOCS_API_KEY` for its own production reads.
      # If the first run 401s, that is the secret to swap in here: the sanity
      # gate in the generator aborts before writing anything, so a wrong-scoped
      # key fails loudly instead of baking a partial catalog.
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_DOCS_API_KEY }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh toolkit slugs
        run: pnpm --filter @composio/cli generate:toolkit-slugs

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- ts/packages/cli/src/generated/toolkit-slugs.ts; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged since the last refresh."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- ts/packages/cli/src/generated/toolkit-slugs.ts
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(cli): refresh baked toolkit slugs'
          title: 'chore(cli): refresh baked toolkit slugs'
          body: |
            ## Summary
            Automated refresh of the toolkit slugs the CLI knows without asking
            the API, generated by `ts/packages/cli/scripts/generate-toolkit-slugs.ts`.

            Toolkits added since the last refresh currently cost users one
            toolkit-list fetch (~2 s) the first time they run one of that
            toolkit's tools. Merging this makes them free.

            The generator refuses to write a list that is short, malformed, or
            missing staple toolkits, so a bad fetch opens no PR at all.
          branch: chore/cli-refresh-toolkit-slugs
          base: next
          add-paths: |
            ts/packages/cli/src/generated/toolkit-slugs.ts
