name: Docs - Publish KB Guide

# The support portal sends this when Front Desk proposes a KB change, and Zen (source: zen) sends it
# when a merged code PR changes what a guide says: a new guide, a rewrite or a retirement. It becomes
# one PR on next, and reviewing and merging that PR is the approval. Each guide
# lives in its own files (kb/guides/<slug>.json, kb/articles, kb/source) and content/kb is generated
# at build time, so PRs for different guides can wait for review side by side without conflicting.
on:
  repository_dispatch:
    types: [kb-guide-approved]

permissions:
  contents: read

concurrency:
  # Shared with docs-update-kb so each run starts from a settled next.
  group: docs-kb-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./docs

    steps:
      # Every payload field that reaches a branch name or the PR body is checked here first.
      - name: Check request
        id: request
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          DRAFT_ID: ${{ github.event.client_payload.draft_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          ORIGIN_URL: ${{ github.event.client_payload.origin_url }}
          ORIGIN_AUTHOR: ${{ github.event.client_payload.origin_author }}
        run: |
          if [ "$SOURCE" = zen ]; then
            if ! [[ "$REQUEST_ID" =~ ^[a-z0-9-]+$ ]]; then
              echo "request_id must match ^[a-z0-9-]+$" >&2
              exit 1
            fi
            if ! [[ "$ORIGIN_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[0-9]+$ ]]; then
              echo "origin_url must be a GitHub pull request URL" >&2
              exit 1
            fi
            if ! [[ "$ORIGIN_AUTHOR" =~ ^[A-Za-z0-9-]+$ ]]; then
              echo "origin_author must be a GitHub login" >&2
              exit 1
            fi
            echo "branch=docs/kb-$REQUEST_ID" >> "$GITHUB_OUTPUT"
          elif [ -z "$SOURCE" ]; then
            if ! [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]; then
              echo "draft_id must be a number" >&2
              exit 1
            fi
            echo "branch=docs/kb-front-desk-$DRAFT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown source: $SOURCE" >&2
            exit 1
          fi
        working-directory: .

      - name: Checkout docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          persist-credentials: false

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply the approved guide
        env:
          GUIDE: ${{ toJSON(github.event.client_payload.guide) }}
        run: |
          printf '%s' "$GUIDE" > "$RUNNER_TEMP/kb-guide.json"
          bun scripts/publish-kb-guide.ts "$RUNNER_TEMP/kb-guide.json"

      - name: Regenerate KB pages
        env:
          GUIDE_SLUG: ${{ github.event.client_payload.guide.slug }}
        run: |
          bun run generate:kb
          bun run check:kb
          # verify:kb exits 1 for any finding in the whole KB. Other guides' findings (such as
          # expired review dates) are tracked by the data-sync freshness check; only this guide's
          # errors and support prose, and KB-wide errors, block its publication.
          bun run verify:kb --json > "$RUNNER_TEMP/kb-verify.json" || true
          jq -e '.findings | type == "array"' "$RUNNER_TEMP/kb-verify.json" > /dev/null
          if ! jq -e '[.findings[] | select(.kind == "unedited-support-prose" and .guideSlug == env.GUIDE_SLUG)] | length == 0' "$RUNNER_TEMP/kb-verify.json"; then
            echo "KB publication contains support-facing prose. Rewrite it for public readers before approving again." >&2
            exit 1
          fi
          if ! jq -e '[.findings[] | select(.severity == "error" and ((.guideSlug // "") == env.GUIDE_SLUG or (.guideSlug // "") == ""))] | length == 0' "$RUNNER_TEMP/kb-verify.json"; then
            jq -r '.findings[] | select(.severity == "error" and ((.guideSlug // "") == env.GUIDE_SLUG or (.guideSlug // "") == "")) | "\(.kind): \(.detail)"' "$RUNNER_TEMP/kb-verify.json" >&2
            echo "KB publication fails verification. Fix the guide before approving again." >&2
            exit 1
          fi

      - name: Generate composio PR token
        id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ComposioHQ
          repositories: composio
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.write-token.outputs.token }}
          commit-message: 'docs(kb): ${{ github.event.client_payload.summary }}'
          title: 'docs(kb): ${{ github.event.client_payload.summary }}'
          body: |
            ${{ github.event.client_payload.source == 'zen' && format('KB guide change proposed by Zen from {0} (@{1}).', github.event.client_payload.origin_url, github.event.client_payload.origin_author) || 'KB guide change proposed by Front Desk in the support portal.' }}

            - Guide: `${{ github.event.client_payload.guide.slug }}` (${{ github.event.client_payload.guide.action }})
            ${{ github.event.client_payload.source != 'zen' && format('- Draft: {0}', github.event.client_payload.portal_url) || '' }}

            Review the article and merge to publish it; close the PR to dismiss it. Nothing merges on its own.
          branch: ${{ steps.request.outputs.branch }}
          base: next
          add-paths: |
            docs/kb/

