name: Release Python Packages
on:
  push:
    tags:
      - 'py@*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build SDK packages
    defaults:
      run:
        working-directory: ./python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install release metadata check dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Validate Python release metadata
        working-directory: .
        run: pnpm test:release-workflow

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Resolve release package set
        id: release_mode
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]

          # PEP 440 compact form (0.23.1rc1) and the separator form emitted by
          # python/scripts/bump.py --pre (0.23.1-rc.1) are both prereleases.
          is_prerelease = re.search(r"(?:a|b|rc|dev)[-_.]?\d", version, re.IGNORECASE) is not None
          print(f"core_only={'true' if is_prerelease else 'false'}")
          PY

      # Install only the locked build tools. `--locked` fails if uv.lock is
      # stale instead of resolving fresh versions from PyPI.
      - name: Install locked build tools
        env:
          UV_PROJECT_ENVIRONMENT: python/.venv
        run: uv sync --locked --only-group release

      - name: Build Artifacts
        env:
          BUILD_ARGS: --no-isolation
        run: |
          if [[ "${{ steps.release_mode.outputs.core_only }}" == "true" ]]; then
            make build-core
          else
            make build
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  # Publishing runs in its own job so the OIDC token is never available to the
  # build steps. PyPI trusts this workflow and environment through trusted
  # publishing, so no long-lived PyPI token is needed.
  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish Artifacts
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
