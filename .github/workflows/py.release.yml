name: Release Python Packages
on:
  push:
    tags:
      - 'py@*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-core:
    name: Build and release SDK
    defaults:
      run:
        working-directory: ./python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install release metadata check dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Validate Python release metadata
        working-directory: .
        run: pnpm test:release-workflow

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Build Artifacts
        run: |
          make env
          make build

      - name: Publish Artifacts
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ./python/dist
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
          skip-existing: true
