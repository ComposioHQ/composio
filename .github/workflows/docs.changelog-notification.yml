name: Changelog Notification

on:
  push:
    branches: [next]
    paths:
      - 'docs/content/changelog/**.mdx'

permissions:
  contents: read

concurrency:
  group: changelog-notification-${{ github.event.after }}
  cancel-in-progress: false

jobs:
  notify-changelog:
    name: Send Changelog Notification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history to detect changes across all commits in push

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve verified changelog finalization
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^..HEAD | grep '^docs/content/changelog/.*\.mdx$' || true)
          else
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM "$BEFORE".."$AFTER" | grep '^docs/content/changelog/.*\.mdx$' || true)
          fi

          printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(length > 0))' \
            > changed-files.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$AFTER/pulls" \
            --paginate --slurp | jq 'add' > associated-prs.json
          jq '[.[] | {
              number,
              state:(if .merged_at != null then "MERGED" elif .state == "open" then "OPEN" else "CLOSED" end),
              head_ref:.head.ref,
              base_ref:.base.ref,
              body:(.body // ""),
              merge_commit_sha:(.merge_commit_sha // null)
            }]' associated-prs.json > finalization-prs.json
          pr_number=$(jq -r \
            '[.[] | select(.body // "" | test("<!-- sdk-release-finalization:[a-f0-9]{64} -->"))] |
             if length == 1 then .[0].number else "" end' associated-prs.json)
          if [[ -n "$pr_number" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
              --paginate --slurp | jq '[add[] | {
                body:(.body // ""),
                author_login:(.user.login // ""),
                author_type:(.user.type // "Unknown"),
                author_association:(.author_association // "NONE")
              }]' > existing-comments.json
          else
            echo '[]' > existing-comments.json
          fi
          bun .github/scripts/sdk-release/finalize-changelog.ts downstream \
            --pull-requests finalization-prs.json \
            --changed-files changed-files.json \
            --comments existing-comments.json \
            --trusted-login 'github-actions[bot]' \
            --channel notification \
            --output downstream-plan.json
          if [[ "$(jq -r .emit downstream-plan.json)" != "true" ]]; then
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGELOG_FILE=$(jq -r '.[0]' changed-files.json)
          pr_number=$(jq -r .pull_request downstream-plan.json)
          manifest_id=$(jq -r .manifest_id downstream-plan.json)
          marker=$(jq -r .marker downstream-plan.json)
          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$manifest_id" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "pull_request=$pr_number" >> "$GITHUB_OUTPUT"
          echo "has_changelog=true" >> "$GITHUB_OUTPUT"

      - name: Extract Changelog Metadata
        if: steps.changed-files.outputs.has_changelog == 'true'
        id: extract-metadata
        run: |
          CHANGELOG_FILE="${{ steps.changed-files.outputs.changelog_file }}"

          # Extract title from frontmatter
          TITLE=$(grep "^title:" "$CHANGELOG_FILE" | sed "s/^title: *['\"]*//" | sed "s/['\"]* *$//")

          # Extract date from frontmatter
          DATE=$(grep "^date:" "$CHANGELOG_FILE" | sed "s/^date: *['\"]*//" | sed "s/['\"]* *$//")

          # Format date for URL (YYYY-MM-DD to YYYY/MM/DD)
          URL_DATE=$(echo "$DATE" | sed 's/-/\//g')

          # Build the changelog URL
          CHANGELOG_URL="https://docs.composio.dev/docs/changelog/${URL_DATE}"

          # Get the commit author who added/modified this changelog
          AUTHOR=$(git log -1 --format='%an' -- "$CHANGELOG_FILE")
          AUTHOR_EMAIL=$(git log -1 --format='%ae' -- "$CHANGELOG_FILE")

          # Build properly escaped JSON payload using jq
          SLACK_PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg date "$DATE" \
            --arg url "$CHANGELOG_URL" \
            --arg author "$AUTHOR" \
            '{text: "*New Changelog Published*\n\n*\($title)*\n\nDate: \($date)\n<\($url)|View Changelog>\nAuthor: \($author)"}')

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "url=$CHANGELOG_URL" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "author_email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT

          # Save the JSON payload for the next step
          echo "slack_payload<<EOF" >> $GITHUB_OUTPUT
          echo "$SLACK_PAYLOAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "📝 Changelog Title: $TITLE"
          echo "📅 Date: $DATE"
          echo "🔗 URL: $CHANGELOG_URL"
          echo "👤 Author: $AUTHOR ($AUTHOR_EMAIL)"

      - name: Send Slack Notification
        if: steps.changed-files.outputs.has_changelog == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_CUSTOMER_COMMS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.extract-metadata.outputs.slack_payload }}

      - name: Record notification completion
        if: ${{ success() && steps.changed-files.outputs.has_changelog == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: ${{ steps.changed-files.outputs.marker }}
          PR_NUMBER: ${{ steps.changed-files.outputs.pull_request }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$MARKER

          Customer changelog notification completed by workflow run $GITHUB_RUN_ID."
