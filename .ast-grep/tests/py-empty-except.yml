id: py-empty-except
valid:
  - |
    try:
        work()
    except ValueError as Exception:
        pass
  - |
    try:
        work()
    except (error_type(Exception), ValueError):
        pass
  - |
    try:
        work()
    except (FileNotFoundError, ValueError):
        pass
  - |
    try:
        work()
    except FileNotFoundError:
        pass
  - |
    try:
        work()
    except Exception:
        logger.exception("Failed to complete work")
  - |
    try:
        work()
    except Exception:
        raise
invalid:
  - |
    try:
        work()
    except (Exception,):
        pass
  - |
    try:
        work()
    except (ValueError, Exception) as error:
        pass
  - |
    try:
        work()
    except (BaseException):
        pass
  - |
    try:
        work()
    except:
        pass
  - |
    try:
        work()
    except Exception as error:
        pass
  - |
    try:
        work()
    except BaseException:
        # Best effort
        pass
