[mypy]
; Exclude directories and files from type checking
; - Type inference test files require provider packages to be installed for proper checking
;   They verify @overload signatures work correctly but need the actual provider types
exclude = ^(apps/composio/|utils/|\.nox/|.*/setup\.py|.*/build/|examples/|.*demo.*|tests/test_type_inference_.*)
strict_optional=True
disable_error_code=var-annotated


; Only add packages which does not have type-stub package
[mypy-pysher.*]
ignore_missing_imports=true

[mypy-crewai.*]
ignore_missing_imports=true

[mypy-vertexai.*]
ignore_missing_imports=true

[mypy-google.adk.*]
ignore_missing_imports=true

[mypy-google.genai.*]
ignore_missing_imports=true

[mypy-proto.marshal.collections.maps]
ignore_missing_imports=true

[mypy-autogen.*]
ignore_missing_imports=true

[mypy-autogen_core.*]
ignore_missing_imports=true

[mypy-claude_agent_sdk.*]
ignore_missing_imports=true

[mypy-mcp.*]
ignore_missing_imports=true

[mypy-llama_index.*]
ignore_missing_imports=true

[mypy-agents.*]
ignore_missing_imports=true

; Composio provider packages (may not be installed)
[mypy-composio_anthropic.*]
ignore_missing_imports=true

[mypy-composio_langchain.*]
ignore_missing_imports=true

[mypy-composio_langgraph.*]
ignore_missing_imports=true

[mypy-composio_llamaindex.*]
ignore_missing_imports=true

[mypy-composio_openai_agents.*]
ignore_missing_imports=true

[mypy-composio_crewai.*]
ignore_missing_imports=true

[mypy-composio_autogen.*]
ignore_missing_imports=true

[mypy-composio_gemini.*]
ignore_missing_imports=true

[mypy-composio_google.*]
ignore_missing_imports=true

[mypy-composio_google_adk.*]
ignore_missing_imports=true

[mypy-composio_claude_agent_sdk.*]
ignore_missing_imports=true

; Disable overload-cannot-match for tools.py - provider types are unavailable
; without installing all provider packages, causing mypy to treat overloads as equivalent
[mypy-composio.core.models.tools]
disable_error_code=overload-cannot-match