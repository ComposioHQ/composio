[project]
name = "composio"
version = "0.18.2"
description = "SDK for integrating Composio with your applications."
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "pysher>=1.0.8",
    "pydantic>=2.11.9",
    "composio-client==1.43.0",
    "typing-extensions>=4.16.0",
    "openai>=2.48.0",
    "json-schema-to-pydantic>=0.4.11",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "composio",
    "nox>=2026.7.11",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-mock>=3.15.1",
    "requests>=2.34.2",
    "ruff>=0.16.0",
    # Langchain provider demo
    "langchain_openai==1.4.1",
    "fastapi>=0.140.0",
    "twine>=6.2.0",
    "click>=8.4.2",
    "semver>=3.0.4",
    # CrewAI 1.x currently constrains Tomli to the 2.0 line.
    "tomli>=2.0.2,<2.1",
]
