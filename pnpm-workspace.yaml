packages:
  - ts/e2e-tests/_utils
  - ts/e2e-tests/cli/*
  - ts/e2e-tests/cli/**/*
  - ts/e2e-tests/runtimes/node/*
  - ts/e2e-tests/runtimes/deno/*
  - ts/e2e-tests/runtimes/cloudflare/*
  - ts/examples/*
  - ts/packages/cli
  - ts/packages/cli-keyring
  - ts/packages/cli-local-tools
  - ts/packages/core
  - ts/packages/experimental
  - ts/packages/json-schema-to-effect-schema
  - ts/packages/json-schema-to-zod
  - ts/packages/slim
  - ts/packages/providers/*
  - ts/packages/ts-builders

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: false
  tree-sitter: true
  workerd: true

catalog:
  '@ai-sdk/openai': ^4.0.20
  '@arethetypeswrong/cli': ^0.18.5
  '@clack/core': '^1.4.3'
  '@clack/prompts': '^1.7.0'
  '@cloudflare/vitest-pool-workers': 0.18.8
  '@cloudflare/workers-types': ^5.20260724.1
  '@composio/client': 0.1.0-alpha.76
  '@effect/cli': ^0.76.0
  '@effect/eslint-plugin': ^0.3.2
  '@effect/language-service': ^0.87.1
  '@effect/platform': ^0.97.0
  '@effect/platform-bun': ^0.91.0
  '@effect/platform-node': ^0.108.0
  '@effect/platform-node-shared': ^0.61.0
  '@effect/vitest': ^0.30.0
  '@mastra/core': ^1.52.1
  '@modelcontextprotocol/sdk': ^1.29.0
  '@types/bun': ^1.3.14
  ai: ^7.0.37
  dotenv: ^17.4.2
  effect: ^3.22.0
  hono: ^4.12.31
  openai: ^6.49.0
  picocolors: ^1.1.1
  pnpm: ^11.17.0
  publint: ^0.3.22
  tsdown: ^0.22.14
  tsx: ^4.23.1
  typescript: ^6.0.3
  typescript-7: npm:typescript@^7.0.2
  '@vitest/ui': ^4.1.10
  vitest: ^4.1.10
  wrangler: ^4.114.0
  zod: ^4.4.3
  zod-to-json-schema: ^3.25.2

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@mastra/core'
  - '@composio/client'
  - chrome-devtools-mcp

peerDependencyRules:
  allowedVersions:
    typescript: ^6.0.0
    vitest: ^4.0.0
    zod: ^4.0.0

overrides:
  qs@<6.14.1: '>=6.14.1'
  protobufjs: 7.6.5
  # temporary: @zed-industries/claude-code-acp@0.16.2 (latest) exact-pins vulnerable 10.2.1; drop when it ships >=10.2.3
  'minimatch@>=10.0.0 <10.2.3': '>=10.2.3 <11'
  # temporary: @redocly/openapi-core@1.34.x (via openapi-typescript) exact-pins vulnerable 4.2.0; drop when it ships >=4.3.0
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0 <5'
  '@hono/node-server@<2.0.5': '>=2.0.5'
  'brace-expansion@<=5.0.7': '>=5.0.8'
  'vite@<=7.3.4': 7.3.5
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
